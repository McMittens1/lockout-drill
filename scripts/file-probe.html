<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'">
<title>file:// probe</title>
</head>
<body>
<pre id="out">pending</pre>
<script>
// Dev helper: checks that the browser APIs Lockout Drill needs work when opened from file://
// under the same Content-Security-Policy as the app. Results are written after every step.
const r = { protocol: location.protocol, secureContext: window.isSecureContext, subtle: !!(window.crypto && crypto.subtle), dialog: typeof HTMLDialogElement === 'function' };
const show = () => { document.getElementById('out').textContent = 'RESULT ' + JSON.stringify(r); };
try { localStorage.setItem('probe', '1'); r.localStorage = localStorage.getItem('probe') === '1'; } catch (e) { r.localStorage = 'error: ' + e.message; }
show();
(async () => {
  try {
    const te = new TextEncoder();
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const base = await crypto.subtle.importKey('raw', te.encode('pass phrase'), 'PBKDF2', false, ['deriveKey']);
    r.step = 'imported'; show();
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 1000 }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    r.step = 'derived'; show();
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode('hello'));
    const pt = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct));
    r.aesRoundTrip = pt === 'hello';
  } catch (e) { r.aesRoundTrip = 'error: ' + e.message; }
  show();
})();
</script>
</body>
</html>
