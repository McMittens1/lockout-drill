function detail(cur, res, r, openEditor) {
  const g = res.graph;
  const sim = res.sim;
  const blocks = [];

  if (r.state > LOCKED) {
    const d = derivation(g, sim, r.id, 6);
    blocks.push(h('div', null, h('h4', null, r.state === OK ? 'How you still get in' : 'Your best way back'), route(g, d)));
  }

  if (r.cycles.length) {
    const c = r.cycles[0];
    const names = c.map(id => g.nodes.get(id)?.label ?? id);
    blocks.push(h('div', { class: 'loop' }, icon('loop'),
      h('div', null, h('b', null, 'Circular dependency. '), names.join(' → '), '. ',
        c.every(id => (sim.state.get(id) ?? LOCKED) === LOCKED)
          ? 'Each needs another to get in, so none of them can be the way back.'
          : 'Right now they can only unlock each other, so the way back has to come from outside the loop.')));
  }

  if (r.state < OK) {
    const b = blockers(g, sim, r.id, { depth: 4 });
    blocks.push(h('div', null, h('h4', null, r.state === LOCKED ? 'What stops every way in' : 'Why not faster'), waysView(g, sim, b, 0, cur.id + ':' + r.id)));
    const fixes = fixesFor(r.id, cur.ctx);
    blocks.push(h('div', null,
      h('h4', null, 'Fixes that would work in this drill'),
      fixes.length
        ? h('div', { class: 'fixes' }, fixes.map(f => h('div', { class: 'fix' },
          h('div', { class: 'ft' }, f.title),
          h('div', { class: 'fd' }, f.detail),
          h('div', { class: 'fa' },
            h('span', { class: 'note' }, 'then'), stateChip(f.after),
            h('button', { class: 'btn small', onclick: () => commit(p => { f.apply(p); }, { undoLabel: 'Added to your setup' }) }, 'Add to my setup')),
        )))
        : h('p', { class: 'note' }, 'No single change we know of fixes this one here. Open the account to add another way in.'),
    ));
  }

  blocks.push(h('div', null, h('button', { class: 'btn small', onclick: () => openEditor(r.id) }, 'Edit ways in')));
  return h('div', { class: 'detail' }, blocks);
}

const phrase = (via, label) => (VIA[via]?.phrase || '{x}').replace('{x}', () => label);

function route(g, d) {
  if (!d) return h('p', { class: 'note' }, 'No way in.');
  if (d.base) return h('p', { class: 'note' }, 'Available directly.');
  const speed = d.way?.speed && d.way.speed !== 'instant' ? h('span', { class: 'kind' }, SPEEDS[d.way.speed].label) : null;
  return h('div', { class: 'route' },
    h('span', { class: 'way' }, d.way?.label || ''), speed,
    (d.picks || []).map(p => [h('span', { class: 'sep' }, '·'), h('span', { class: 'node' }, phrase(p.via, p.label)), subRoute(g, p.sub)]),
  );
}

// One short clause explaining how a picked item itself is reachable, when that matters.
function subRoute(g, sub) {
  if (!sub || sub.base || !sub.way) return null;
  const node = g.nodes.get(sub.id);
  if (!node) return null;
  if (node.type === 'account') return h('span', { class: 'note' }, `(via ${sub.way.label.toLowerCase()}${sub.state < OK ? ', ' + SPEEDS[sub.way.speed]?.label.toLowerCase() : ''})`);
  if (sub.way.id === 'restore') return h('span', { class: 'note' }, '(restored from backup)');
  if (sub.way.id === 'store' || sub.way.id === 'esim') return h('span', { class: 'note' }, `(${sub.way.label.toLowerCase()}, days)`);
  if (sub.way.id === 'written') return h('span', { class: 'note' }, '(from the written copy)');
  if (sub.state === SLOW && node.src?.at && node.src.at !== 'carried') return h('span', { class: 'note' }, '(once you get back to it)');
  return null;
}

const DISABLED = {
  lost: 'Not possible: this is gone',
  hijacked: 'Not possible: the account was taken over',
  abroad: "Not possible from abroad",
  'only-you': 'Only you can do this',
  'only-heir': 'Only after your death',
  'data-only': 'Hands over the data, not a way to sign in',
};

function waysView(g, sim, b, depth, path) {
  if (b.cycle) return h('p', { class: 'note' }, '↺ loops back to ', h('b', null, g.nodes.get(b.cycle[b.cycle.length - 1])?.label || ''), ', already shown above.');
  if (b.truncated) return h('p', { class: 'note' }, '…');
  const node = g.nodes.get(b.id);
  if (!b.ways.length) {
    return h('p', { class: 'note' }, b.lost ? reasonFor(g, node, sim.ctx) : (node?.type === 'account' ? 'No ways in are set up.' : reasonFor(g, node, sim.ctx) || 'Unavailable'));
  }
  const ways = b.ways.filter(w => w.disabled !== 'only-heir' || sim.ctx.perspective === 'heir').filter(w => w.disabled !== 'only-you' || sim.ctx.perspective !== 'heir' || depth === 0);
  return h('div', { class: 'ways' }, ways.map(w => {
    const head = h('div', { class: 'wh' },
      w.disabled ? h('span', { class: 'off' }, '—') : stateChip(w.value, w.value === OK ? 'Works' : STATE_LABEL[w.value]),
      h('span', { class: 'lbl' }, w.label),
      w.speed !== 'instant' ? h('span', { class: 'kind' }, SPEEDS[w.speed].label) : null,
      w.disabled ? h('span', { class: 'off' }, DISABLED[w.disabled] || w.disabled) : null,
    );
    if (w.disabled || !w.failing.length) return h('div', { class: 'wayx' }, head);
    return h('div', { class: 'wayx' }, head,
      h('ul', null, w.failing.map(f => h('li', null,
        h('span', { class: 'sl' }, f.step + ':'),
        f.empty ? h('span', { class: 'warnline' }, 'nothing chosen') : f.options.map(o => optionView(g, sim, o, depth, `${path}>${w.id}>${o.ref}`)),
      ))),
    );
  }));
}

function optionView(g, sim, o, depth, key) {
  const node = g.nodes.get(o.ref);
  const reason = o.why.lost ? reasonFor(g, node, sim.ctx) : (node && node.base && node.base(sim.ctx) < OK && !node.ways.length ? reasonFor(g, node, sim.ctx) : null);
  const label = h('span', null, phrase(o.via, o.label));
  const tag = reason ? h('em', { class: 'tone0' }, ` (${reason})`) : h('span', null, ' ', stateChip(o.state));
  const expandable = !o.why.lost && !o.why.cycle && o.why.ways.some(w => w.failing.length || w.disabled) && depth < 3;
  if (!expandable) return h('span', { class: 'opt' }, label, tag, o.why.cycle ? h('em', { class: 'note' }, ' ↺ loop') : null);
  const d = h('details', { class: 'sub', open: S.openDetails.has(key) },
    h('summary', { dataset: { k: 'd:' + key } }, label, tag),
    waysView(g, sim, o.why, depth + 1, key),
  );
  d.addEventListener('toggle', () => { d.open ? S.openDetails.add(key) : S.openDetails.delete(key); });
  return h('span', { class: 'opt' }, d);
}

return { drillView, tallyText };

const __m_setup = (() => {

function select(key, value, options, onchange, label) {

function patchThing(id, patch, opts) {
  commit(p => {
    const t = p.things.find(x => x.id === id);
    if (!t) return;
    for (const [k, v] of Object.entries(patch)) {
      // '' or null clears a field back to its default; false is kept (e.g. heirCan: false).
      if (v === '' || v == null) delete t[k];
      else t[k] = v;
    }
  }, opts);
}

function placeOptions(exceptId) {
  // A place can't sit inside itself or its own descendants.
  const bad = new Set();
  if (exceptId) {
    bad.add(exceptId);
    let grew = true;
    while (grew) {
      grew = false;
      for (const t of byKind('place')) if (t.inside && bad.has(t.inside) && !bad.has(t.id)) { bad.add(t.id); grew = true; }
    }
  }
  return byKind('place').filter(p => !bad.has(p.id)).map(p => [p.id, p.name]);

    case 'phone': return { ...base, name: phones.length ? 'Second phone' : 'Phone', at: 'carried' };
    case 'computer': return { ...base, name: 'Laptop', at: home ? home.id : 'carried' };
    case 'tablet': return { ...base, name: 'Tablet', at: home ? home.id : 'carried' };
    case 'seckey': return { ...base, name: 'Security key', at: 'carried' };
    case 'paper': return { ...base, name: 'Printed backup codes', at: home ? home.id : 'carried' };

          } else patchThing(t.id, { unlock: v });
        }, 'Unlocked with')));
      out.push(heirToggle());
      out.push(noteField());
      break;
    case 'seckey': case 'paper': case 'photoid':
      out.push(where());
      out.push(heirToggle());
      out.push(noteField());
      break;
    case 'number':
      out.push(h('label', { class: 'f' }, 'SIM in',
        select(k + ':sim', t.sim || '', [['', 'No phone (not in use)'], ...byKind('phone', 'tablet').map(d => [d.id, d.name])], v => patchThing(t.id, { sim: v }), 'SIM in')));

      break;
    case 'authapp': {
      const devices = byKind('phone', 'tablet', 'computer');
      out.push(h('span', { class: 'f' }, 'On', chips(k + ':dev', t.devices || [], devices.map(d => [d.id, d.name]), ids => patchThing(t.id, { devices: ids.length ? ids : '' }))));
      const backupOpts = [['', 'No backup'], ...S.profile.accounts.map(a => [a.id, a.name]), ...byKind('number').map(n => [n.id, 'Number ' + n.name]), ...byKind('paper').map(p => [p.id, p.name])];
      out.push(h('label', { class: 'f' }, 'Backs up to', select(k + ':backup', t.backup || '', backupOpts, v => patchThing(t.id, { backup: v }), 'Backs up to')));
      if (t.backup) out.push(h('label', { class: 'f' }, 'Backup password', select(k + ':bpw', t.backupSecret || '', [['', 'None'], ...byKind('secret').map(s => [s.id, s.name])], v => patchThing(t.id, { backupSecret: v }), 'Backup password')));
      const preset = AUTHAPP_PRESETS.find(p => t.name.toLowerCase().includes(p.name.toLowerCase()));
      if (preset) out.push(h('span', { class: 'note', style: 'flex-basis:100%' }, preset.backupHint));
      break;
    }
    case 'secret':
      out.push(h('span', { class: 'f' }, 'Written on', chips(k + ':w', t.writtenOn || [], byKind('paper').map(p => [p.id, p.name]), ids => patchThing(t.id, { writtenOn: ids.length ? ids : '' }), 'Nowhere')));
      out.push(h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: !!t.shared, dataset: { k: k + ':shared' }, onchange: e => patchThing(t.id, { shared: e.target.checked }) }), `${trusted()} knows it`));
      break;
    case 'place': {
      out.push(h('label', { class: 'f' }, 'Inside', select(k + ':inside', t.inside || '', [['', 'Nothing (a building or site)'], ...placeOptions(t.id)], v => patchThing(t.id, { inside: v, ...(v ? { home: false } : {}) }), 'Inside')));
      if (!t.inside) out.push(h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: !!t.home, dataset: { k: k + ':home' }, onchange: e => patchThing(t.id, { home: e.target.checked }) }), 'Home'));
      if (t.inside) out.push(h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: !!t.fireproof, dataset: { k: k + ':fp' }, onchange: e => patchThing(t.id, { fireproof: e.target.checked }) }), 'Fireproof'));
      out.push(h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: t.heirCan !== false, dataset: { k: k + ':heir' }, onchange: e => patchThing(t.id, { heirCan: e.target.checked ? '' : false }) }), `${trusted()} can get in`));
      out.push(noteField());
      break;
    }
    case 'person':
      out.push(h('span', { class: 'note' }, 'Use them as a recovery, legacy or emergency contact in your accounts.'));
      break;
  }
  return out;
}

// Fill obvious choices when there is exactly one candidate (one password manager, one number...).
function autofill(account, profile = S.profile) {
  const others = [...profile.things, ...profile.accounts.filter(a => a.id !== account.id)];
  const only = (type) => {
    const c = others.filter(x => accepts(type, x));
    return c.length === 1 ? c[0] : null;
  };
  for (const w of account.ways) {
    if (w.enabled === false) continue;
    for (const s of w.steps) {
      if (s.anyOf.length) continue;
      for (const type of s.types) {
        if (['push', 'session', 'trusted_device', 'any', 'account', 'backup', 'passkey'].includes(type)) continue;
        const pick = type === 'password'
          ? (profile.accounts.filter(a => a.category === 'password_manager' && a.id !== account.id).length === 1 ? profile.accounts.find(a => a.category === 'password_manager' && a.id !== account.id) : null)
          : only(type);
        if (pick) { s.anyOf.push({ ref: pick.id, via: type }); break; }
      }
    }
  }
  return account;
}

function addAccountFromTemplate(tplId, overrides = {}) {
  const t = TEMPLATE_BY_ID.get(tplId);
  const a = autofill(accountFromTemplate(t, uid('acct'), overrides));
  commit(p => { p.accounts.push(a); });
  return a.id;
}

function stepEditor(a, w, wi, s, si, edit, k) {
  const phrase = (via, id) => (VIA[via]?.phrase || '{x}').replace('{x}', () => nameOf(id));
  const candidates = [...things(), ...S.profile.accounts.filter(x => x.id !== a.id)];
  const groups = s.types.map(type => ({ type, items: candidates.filter(c => accepts(type, c) && !s.anyOf.some(o => o.ref === c.id && o.via === type)) }));
  const onPick = (v) => {
    if (!v) return;
    const [type, ref] = v.split('|');
    if (type === 'new') {
      if (!Object.hasOwn(NEW_FOR, ref)) return;
      const make = NEW_FOR[ref];
      const home = homePlace();
      const t = { id: uid('t'), ...make(a) };
      if (THING_KINDS[t.kind].physical && !t.at) t.at = home ? home.id : 'carried';
      edit((acc, p) => { p.things.push(t); acc.ways[wi].steps[si].anyOf.push({ ref: t.id, via: ref }); });
      toast(`Added "${t.name}" to What you have. Rename it or say where it's kept in Setup.`);
      return;
    }
    edit(acc => { acc.ways[wi].steps[si].anyOf.push({ ref, via: type }); });
  };
  const newOpts = s.types.filter(t => Object.hasOwn(NEW_FOR, t));
  return h('div', { class: 'stepr' },
    h('span', { class: 'sl' }, s.label),
    h('span', { class: 'chips' },
      s.anyOf.map((o, oi) => h('span', { class: 'chip' }, phrase(o.via, o.ref),

      s.anyOf.length > 0 ? h('span', { class: 'note' }, s.anyOf.length > 1 ? '(any one works)' : '') : null,
      h('select', { class: 'add', dataset: { k: `${k}:s${si}:add` }, 'aria-label': `Add to ${s.label}`, onchange: e => onPick(e.target.value) },
        h('option', { value: '' }, s.anyOf.length ? '+ or…' : '+ choose…'),
        groups.filter(g => g.items.length).map(g => h('optgroup', { label: VIA[g.type].label }, g.items.map(c => h('option', { value: `${g.type}|${c.id}` }, c.name)))),
        newOpts.length ? h('optgroup', { label: 'Add something new' }, newOpts.map(t => h('option', { value: `new|${t}` }, `New ${VIA[t].label.toLowerCase()}…`))) : null,
      ),
    ),
    !s.anyOf.length && w.enabled !== false ? h('span', { class: 'warnline' }, 'Choose at least one, or switch this way off.') : null,
  );
}

function importDialog(close) {
  const d = S.dialog;
  const onFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 25 * 1024 * 1024) { d.error = 'That file is too large for a password export.'; rerender(); return; }
    try {
      let text = await readFile(file);
      const result = sitesFromExport(text);
      text = null; // drop the raw export right away
      e.target.value = '';
      const known = new Map();
      const other = [];
      for (const site of result.sites) {
        const t = templateForDomain(site.domain);
        if (t && !t.bulk && t.id !== 'generic') {
          const prev = known.get(t.id);
          if (prev) { prev.count += site.count; prev.hasTotp = prev.hasTotp || site.hasTotp; }
          else known.set(t.id, { template: t, count: site.count, hasTotp: site.hasTotp, name: t.name, pick: !S.profile.accounts.some(a => a.template === t.id) });
        } else other.push(site);
      }
      d.result = { format: result.format, total: result.total, known: [...known.values()], other, groupOthers: other.length > 0, totpGroup: other.some(s => s.hasTotp) };
      d.error = null;
    } catch (err) {
      d.error = err.message || String(err);
      d.result = null;
    }
    rerender();
  };
  const r = d.result;
  const emails = S.profile.accounts.filter(a => a.category === 'email' || a.category === 'platform');
  const addAll = () => {
    let n = 0;
    for (const k of r.known) if (k.pick) { addAccountFromTemplate(k.template.id); n++; }
    const totpSites = r.totpGroup ? r.other.filter(s => s.hasTotp) : [];
    const plainSites = r.other.filter(s => !totpSites.includes(s));
    const plain = plainSites.reduce((x, s) => x + s.count, 0);
    const withTotp = totpSites.reduce((x, s) => x + s.count, 0);
    if (r.groupOthers && plain > 0) {
      // Replace an existing estimate (e.g. from the quick start) with the real number.
      const existing = S.profile.accounts.find(a => a.template === 'email-reset');
      if (existing && plain > 1) {
        commit(p => { const a = p.accounts.find(x => x.id === existing.id); a.count = plain; }, { silent: true });
      } else {
        const id = addAccountFromTemplate('email-reset', plain > 1 ? { name: 'Sites that reset by email', count: plain } : { name: plainSites[0].name });
        if (d.email) commit(p => { const a = p.accounts.find(x => x.id === id); const st = a.ways.find(w => w.key === 'reset').steps[0]; if (!st.anyOf.length) st.anyOf.push({ ref: d.email, via: 'email_code' }); }, { silent: true });
      }
      n++;
    }
    if (r.groupOthers && withTotp > 0) {
      addAccountFromTemplate('generic', withTotp > 1 ? { name: 'Sites with authenticator codes', count: withTotp } : { name: totpSites[0].name });
      n++;
    }
    close();
    toast(`Added ${plural(n, 'account')}. Open each one to check its ways in.`);
    S.view = 'setup';
    rerender();
  };
  return h('div', { class: 'dlg' },
    h('div', { class: 'dlg-h' }, h('h2', null, 'Import your list of sites'), h('button', { class: 'icon-btn', 'aria-label': 'Close', onclick: close }, icon('x'))),

function lockScreen() {
  const env = S.pendingEnvelope;
  let busy = false;
  const submit = async (e) => {
    e.preventDefault();
    if (busy) return;
    busy = true;
    const form = e.target;
    const pass = form.pass.value;
    const err = form.querySelector('.err');
    const btn = form.querySelector('button[type=submit]');
    const forgot = form.querySelector('.forgot');
    btn.disabled = true; btn.textContent = 'Unlocking…';
    if (forgot) forgot.disabled = true;
    try {
      const { profile, keyring } = await decryptEnvelope(env, pass);
      // The person may have erased or reloaded while the key was being derived.
      if (S.screen !== 'lock' || S.pendingEnvelope !== env) return;
      S.keyring = keyring;
      S.profile = normalize(profile);
      S.pendingEnvelope = null;
      S.screen = 'app';
      S.version++;
      rerender();
    } catch (x) {
      if (S.screen !== 'lock' || S.pendingEnvelope !== env) return;
      err.textContent = x instanceof WrongPassphrase ? 'That passphrase does not open this setup.' : x.message;
      btn.disabled = false; btn.textContent = 'Unlock';
      if (forgot) forgot.disabled = false;
      busy = false;
      form.pass.select();
    }
  };
  return h('main', null,
    h('form', { class: 'lockscreen', onsubmit: submit },
      h('div', { class: 'brand' }, logo(), 'Lockout Drill'),
      h('h1', null, 'Your setup is locked'),
      h('p', { class: 'note' }, 'It is encrypted in this browser. Enter your passphrase to open it.'),
      h('input', { type: 'password', name: 'pass', autocomplete: 'current-password', 'aria-label': 'Passphrase', dataset: { k: 'lock:pass' }, autofocus: true }),
      h('p', { class: 'err', role: 'alert' }),
      h('button', { class: 'btn primary', type: 'submit' }, 'Unlock'),
      h('button', { class: 'btn ghost danger forgot', type: 'button', onclick: () => openDialog({ type: 'confirm', title: 'Erase the locked setup?', text: 'Without the passphrase it cannot be opened. This removes it from this browser. Files you saved are not affected.', yes: 'Erase and start over', danger: true, onYes: eraseAll }) }, 'Forgot the passphrase?'),
    ),
  );
}

async function lockNow() {
  // Only lock once the encrypted copy is safely stored; otherwise locking would lose the setup.
  const ok = await persistNow();
  const stored = ok ? readStored() : null;
  if (!ok || !isEncrypted(stored)) {
    toast("Can't lock: this browser didn't save your encrypted setup. Use Save to file first, or locking would lose it.", { ms: 9000 });
    rerender();
    return;
  }
  dropInMemory();
  S.pendingEnvelope = stored;
  S.screen = 'lock';
  rerender();
}

// ------------------------------------------------------------------------------------------
// Files

function localDate(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

async function saveFile() {
  // A plan opened from a handover file stays inside that encrypted file.
  if (S.ephemeral) { toast('This is a read-only copy from a handover file, so it cannot be saved separately.'); return; }
  const payload = S.keyring ? await encryptWith(S.keyring, S.profile) : { app: 'lockout-drill', encrypted: false, v: 1, savedAt: new Date().toISOString(), profile: S.profile };
  download(`lockout-drill-${localDate()}${S.keyring ? '.encrypted' : ''}.json`, JSON.stringify(payload, null, S.keyring ? 0 : 1));
  toast(S.keyring ? 'Saved an encrypted copy to your downloads.' : 'Saved to your downloads. It is not encrypted: keep it somewhere private, or set a passphrase first.', { ms: 7000 });
}

function openFile() {
  const input = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
  input.addEventListener('change', async () => {
    const file = input.files?.[0];
    input.remove();
    if (!file) return;
    try {
      if (file.size > 20 * 1024 * 1024) throw new Error('That file is too large to be a Lockout Drill setup.');
      let data;
      try { data = JSON.parse(await readFile(file)); } catch { throw new Error("That file isn't valid JSON. Choose a file saved by Lockout Drill."); }
      const u = unwrap(data);
      if (u.envelope) openDialog({ type: 'passphrase', mode: 'file', envelope: u.envelope });
      else adoptProfile(u.profile, null);
    } catch (e) {
      toast(e.message || String(e), { ms: 7000 });
      rerender();
    }
  });
  document.body.append(input);
  input.click();
}

// The handover file: this app plus the plan, encrypted under a passphrase of its own.
async function createHandover(pass) {
  const keyring = await makeKeyring(pass);
  const now = new Date().toISOString();
  const savedHash = planFingerprint(S.profile);
  const copy = JSON.parse(JSON.stringify(S.profile));
  delete copy.sample;
  copy.handover = { note: '', contacts: '', ...(copy.handover || {}), savedAt: now, savedHash };
  const html = makeHandoverHtml(pristineHtml(), await encryptWith(keyring, copy));
  // A neutral name: the file may travel by email or a shared drive, and nothing readable should say whose it is.
  download(`handover-guide-${localDate()}.html`, html, 'text/html');
  S.dialog = null;
  stampHandover({ savedAt: now, savedHash });
  toast(`Handover file saved to your downloads. Give ${S.profile.trusted || 'them'} the passphrase separately.`, { ms: 9000 });
  rerender();
}

// Opening a file never replaces a passphrase you already use here: the opened setup is
// re-encrypted under yours. With no passphrase yet, an encrypted file's key is adopted, upgraded
// to full strength if the file used fewer KDF rounds.
async function adoptProfile(profile, fileKeyring, pass) {
  const hadProfile = !!S.profile;
  if (!S.keyring && fileKeyring) {
    S.keyring = fileKeyring.iterations >= KDF_ITERATIONS ? fileKeyring : await makeKeyring(pass);
  }
  replaceProfile(profile, { keepHistory: hadProfile });
  S.screen = 'app';
  S.dialog = null;
  toast(`Opened a setup with ${plural(profile.accounts.length, 'account')}.`, { undo: hadProfile });
  schedulePersist();
  rerender();
}

function passphraseDialog(d) {
  const file = d.mode === 'file';
  const submit = async (e) => {
    e.preventDefault();
    const f = e.target;
    const err = f.querySelector('.err');
    const btn = f.querySelector('button[type=submit]');
    const pass = f.pass.value;
    if (file) {
      btn.disabled = true; btn.textContent = 'Opening…';

        const { profile, keyring } = await decryptEnvelope(d.envelope, pass);

      } catch (x) {
        err.textContent = x instanceof WrongPassphrase ? 'That passphrase does not open this file.' : x.message;
        btn.disabled = false; btn.textContent = 'Open';
      }
      return;
    }
    if (pass.length < 8) { err.textContent = 'Use at least 8 characters. A few random words work well.'; return; }
    if (pass !== f.again.value) { err.textContent = "The two passphrases don't match."; return; }
    btn.disabled = true; btn.textContent = 'Encrypting…';
    try {
      S.keyring = await makeKeyring(pass);
      S.dialog = null;
      const ok = await persistNow();
      toast(ok ? 'Encrypted. You will need this passphrase to open your setup.'

      h('label', { class: 'field' }, 'Passphrase', h('input', { type: 'password', name: 'pass', autocomplete: file ? 'current-password' : 'new-password', autofocus: true, dataset: { k: 'pp:1' } })),

// ------------------------------------------------------------------------------------------
// Printable recovery plan

// What gets printed: the recovery plan (for you) or the handover guide (for the person you trust).
// Ctrl+P prints whichever fits the screen you're on.
let printKind = null;
function printNow(kind) {
  printKind = kind;
  buildPrint(kind);
  window.print();
}
function printPlan() { printNow('plan'); }
function printGuide() { printNow('guide'); }

function contextPrintKind() {
  if (S.screen === 'guide') return 'guide';
  if (S.screen !== 'app' || !S.profile) return null;
  return S.view === 'handover' ? 'guide' : 'plan';
}

function buildPrint(kind) {
  if (kind === 'guide') {
    // The recipient always prints the guide as handed over, even after exploring and editing a copy.
    const g = (S.screen === 'guide' || S.ephemeral) && S.guideProfile ? (S.guideCache || (S.guideCache = buildGuide(S.guideProfile))) : S.profile ? guide() : null;
    $('#print').replaceChildren();
    if (g) $('#print').append(guideDoc(g, { print: true }));
  } else if (kind === 'plan') buildPlan();
  else $('#print').replaceChildren();
}

function buildPlan() {
  const p = S.profile;
  if (!p) { $('#print').replaceChildren(); return; }
  const an = analysis();
  const label = id => an.graph.nodes.get(id)?.label ?? id;
  const places = p.things.filter(t => t.kind === 'place');
  const at = new Map();
  for (const t of p.things.filter(t => PHYSICAL_KINDS.has(t.kind))) {
    const k = t.at && t.at !== 'carried' ? t.at : 'carried';
    if (!at.has(k)) at.set(k, []);
    at.get(k).push(t.name);
  }
  const rows = presets().map(sc => {
    const r = scenarioResult(sc.id, sc.ctx);
    const names = s => r.rows.filter(x => x.state === s).map(x => x.name);
    return h('tr', null, h('td', null, sc.title), h('td', null, names(0).join(', ') || '—'), h('td', null, names(1).join(', ') || '—'), h('td', null, names(2).join(', ') || '—'));
  });
  const phone = presets().find(s => s.id === 'phone');
  const routes = phone ? p.accounts.filter(a => a.important).map(a => {
    const r = scenarioResult(phone.id, phone.ctx);
    const d = derivation(r.graph, r.sim, a.id, 1);
    return h('li', null, h('b', null, a.name), ': ', d?.way ? d.way.label + (d.picks?.length ? ' (' + d.picks.map(x => x.label).join(', ') + ')' : '') : 'no way back in found');
  }) : [];
  const fragile = p.accounts.filter(a => an.resilience.get(a.id) === 1);
  $('#print').replaceChildren();
  append($('#print'), [
    h('h1', null, 'Recovery plan', p.owner ? ` — ${p.owner}` : ''),
    h('p', null, `Printed ${new Date().toLocaleDateString()} from Lockout Drill. Review it whenever you change phones, numbers or passwords.`),
    h('div', { class: 'warnbox' }, 'This sheet says where your recovery materials are kept. Store it the way you would store the materials themselves, and never write codes or passwords on it.'),
    h('h2', null, 'Where things are'),
    h('ul', null, [...at.entries()].map(([k, list]) => h('li', null, h('b', null, k === 'carried' ? 'Carried every day' : (places.find(x => x.id === k)?.name || k)), ': ', list.join(', ')))),
    h('h2', null, 'Drill results'),
    h('table', null, h('thead', null, h('tr', null, h('th', null, 'Scenario'), h('th', null, 'Locked out'), h('th', null, 'Appeal only'), h('th', null, 'Takes days'))), h('tbody', null, rows)),
    routes.length ? [h('h2', null, 'If your phone is stolen: fastest way back into each important account'), h('ul', null, routes)] : null,
    fragile.length ? [h('h2', null, 'Accounts one loss away from lockout'), h('ul', null, fragile.map(a => h('li', null, a.name, ': ', (an.sets.get(a.id) || []).filter(s => s.length === 1).map(s => label(s[0])).join(', or '))))] : null,
    p.trusted ? [h('h2', null, `For ${p.trusted}`), h('p', null, 'If something happens to me, the handover guide (the Handover tab in Lockout Drill) has the steps in order. Start with the places above.')] : null,
  ]);
}

// Keyboard

function typing(e) {
  const t = e.target;
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
}

document.addEventListener('keydown', (e) => {
  if (S.screen !== 'app') return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(); return; }
  // Plain Ctrl/Cmd+Z only: Shift+Z is "redo" elsewhere and must not undo a second change.
  if (mod && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'z' && !typing(e) && !S.dialog) { e.preventDefault(); undo(); return; }
  if (typing(e) || mod || e.altKey || S.dialog) return;
  const i = ['1', '2', '3', '4'].indexOf(e.key);
  if (i >= 0) setView(VIEWS[i]);
});

document.addEventListener('click', (e) => {
  if (S.menu && !e.target.closest('.menu-wrap')) { S.menu = false; rerender(); }
});

// ------------------------------------------------------------------------------------------
// Boot

// Another tab saved, changed the passphrase, or erased: follow it instead of overwriting it.
async function onStorage(e) {
  if (S.ephemeral) return;
  if (e.key !== STORE_KEY && e.key !== null) return;
  let data = null;
  try { data = e.newValue ? JSON.parse(e.newValue) : null; } catch { return; }
  if (!data) {
    if (S.screen === 'welcome') return;
    dropInMemory();
    S.pendingEnvelope = null; S.dialog = null; S.screen = 'welcome';
    rerender();
    toast('Your setup was erased in another tab.');
    return;
  }
  let u;
  try { u = unwrap(data); } catch { return; }
  if (u.envelope) {
    if (S.keyring && u.envelope.kdf.salt === S.keyring.salt) {
      try { S.profile = normalize(await decryptWith(S.keyring, u.envelope)); S.version++; clearCache(); S.saveState = 'saved'; rerender(); return; } catch { /* fall through to lock */ }
    }
    dropInMemory();
    S.pendingEnvelope = u.envelope; S.dialog = null; S.screen = 'lock';
    rerender();
    toast('Your setup was locked or its passphrase changed in another tab.');
    return;
  }
  S.keyring = null;
  S.profile = u.profile; S.version++; clearCache(); S.saveState = 'saved';
  if (S.screen !== 'quickstart') S.screen = 'app';
  rerender();
}

function boot() {
  onRender(requestRender, renderChrome);
  document.addEventListener('pointerdown', () => { pointerDown = true; }, true);
  const release = () => {
    if (!pointerDown) return;
    pointerDown = false;
    // The click for this press is dispatched before this timer runs.
    if (renderPending) setTimeout(() => { if (renderPending) render(); }, 0);
  };
  document.addEventListener('pointerup', release, true);
  document.addEventListener('pointercancel', release, true);
  // Native pop-ups (select menus) can swallow the pointerup: never stay stale for long.
  setInterval(() => { if (renderPending && pointerDown) { pointerDown = false; render(); } }, 700);
  window.addEventListener('storage', onStorage);
  window.addEventListener('afterprint', () => $('#print').replaceChildren());
  window.addEventListener('beforeunload', (e) => {
    if (S.profile && !S.profile.sample && (S.saveState === 'unsaved' || S.saveState === 'error')) { e.preventDefault(); e.returnValue = ''; }
  });
  const dlg = $('#dlg');
  dlg.addEventListener('close', () => { if (S.dialog) { S.dialog = null; rerender(); } });
  dlg.addEventListener('click', (e) => { if (e.target === dlg) closeDialog(); });
  window.addEventListener('beforeprint', () => { buildPrint(printKind || contextPrintKind()); });
  window.addEventListener('afterprint', () => { printKind = null; });
  if (EMBEDDED) {
    // A handover file: never read or write this browser's saved setup.
    S.ephemeral = true;
    S.handoverEnv = isEncrypted(EMBEDDED) ? EMBEDDED : null;
    S.screen = 'guidelock';
    render();
    return;
  }
  startApp();
}

function startApp() {
  const prefs = readPrefs();
  S.view = VIEWS.includes(prefs.view) ? prefs.view : 'plan';
  const stored = readStored();
  if (!stored) {
    S.screen = 'welcome';
  } else {
    try {
      const u = unwrap(stored);
      if (u.envelope) { S.pendingEnvelope = u.envelope; S.screen = 'lock'; }
      else { S.profile = u.profile; S.screen = 'app'; }
    } catch {
      S.screen = 'welcome';
      toast('Your saved setup could not be read, so we started fresh. Open a saved file if you have one.', { ms: 9000 });
    }
  }
  render();
}

return { boot };
})();

__m_app.boot();
</script>
