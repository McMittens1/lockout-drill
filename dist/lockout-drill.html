<title>Lockout Drill</title>

<style id="app-style">:root {
  --bg: #f4f2ec;
  --panel: #fffefa;
  --sunk: #efece4;
  --ink: #1a1c20;
  --ink-2: #454a52;
  --muted: #6c7179;
  --line: #e1ddd3;
  --line-2: #cfc9bc;
  --accent: #2350b0;
  --accent-2: #1b3f8c;
  --accent-bg: #e6ecf8;
  --accent-ink: #ffffff;
  --ok: #1d7446;
  --ok-bg: #e2f1e8;
  --slow: #8f5a00;
  --slow-bg: #f9eed6;
  --appeal: #ad4318;
  --appeal-bg: #fae4d9;
  --locked: #b0241c;
  --locked-bg: #f8dcd8;
  --radius: 8px;
  --radius-s: 6px;
  --shadow: 0 1px 2px rgba(20, 20, 10, .06), 0 8px 24px rgba(20, 20, 10, .06);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141518; --panel: #1b1d21; --sunk: #202328; --ink: #eceae4; --ink-2: #c3c0b8; --muted: #9a978f;
    --line: #2d3036; --line-2: #3b3f46; --accent: #8fb0ff; --accent-2: #b3caff; --accent-bg: #1f2a44; --accent-ink: #0d1424;
    --ok: #6fd39c; --ok-bg: #16301f; --slow: #f0bf5a; --slow-bg: #33280f; --appeal: #ff9e73; --appeal-bg: #3a1f14; --locked: #ff8a80; --locked-bg: #3d1a18;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141518; --panel: #1b1d21; --sunk: #202328; --ink: #eceae4; --ink-2: #c3c0b8; --muted: #9a978f;
  --line: #2d3036; --line-2: #3b3f46; --accent: #8fb0ff; --accent-2: #b3caff; --accent-bg: #1f2a44; --accent-ink: #0d1424;
  --ok: #6fd39c; --ok-bg: #16301f; --slow: #f0bf5a; --slow-bg: #33280f; --appeal: #ff9e73; --appeal-bg: #3a1f14; --locked: #ff8a80; --locked-bg: #3d1a18;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  padding: 8px 14px; border-radius: var(--radius-s); border: 1px solid var(--line-2);
  background: var(--panel); color: var(--ink); cursor: pointer; font-weight: 550; font-size: 14px;
  white-space: nowrap; text-decoration: none;
}
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--sunk); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.danger { color: var(--locked); }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; border: 0; background: transparent; cursor: pointer; color: var(--muted); }
.icon-btn:hover { background: var(--sunk); color: var(--ink); }

input[type=text], input[type=password], input[type=number], input[type=search], select, textarea {
  border: 1px solid var(--line-2); border-radius: var(--radius-s); background: var(--panel);
  padding: 6px 9px; min-height: 34px; max-width: 100%;
}
textarea { width: 100%; resize: vertical; line-height: 1.45; font-weight: 400; }
.linkish { border: 0; background: transparent; padding: 0; cursor: pointer; font: inherit; color: inherit; display: inline-flex; align-items: center; gap: 6px; text-align: left; }
.linkish:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
input[type=text]:focus, input[type=password]:focus, input[type=number]:focus, input[type=search]:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-bg); }
select { padding-right: 24px; }
label.check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 14px; color: var(--ink-2); }
input[type=checkbox], input[type=radio] { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }

/* ---------- Shell ---------- */
.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
  padding: 10px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: -.01em; font-size: 16px; white-space: nowrap; }
.brand .mark { width: 26px; height: 26px; }
.tabs { display: flex; gap: 2px; background: var(--sunk); padding: 3px; border-radius: 8px; }
.tab { border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 550; color: var(--ink-2); font-size: 14px; }
.tab[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.top .spacer { flex: 1; }
.status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.status.warn .dot { background: var(--slow); }
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 260px; background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px; z-index: 30;
}
.menu button { display: flex; width: 100%; text-align: left; align-items: center; gap: 10px; padding: 8px 10px; border: 0; background: transparent; border-radius: 6px; cursor: pointer; font-size: 14px; }
.menu button:hover, .menu button:focus-visible { background: var(--sunk); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
.menu .danger { color: var(--locked); }

main { max-width: 1240px; margin: 0 auto; padding: 24px 20px 80px; }
.banner {
  display: flex; gap: 12px; align-items: center; background: var(--accent-bg); color: var(--ink);
  border-radius: var(--radius); padding: 10px 14px; margin-bottom: 18px; font-size: 14px; flex-wrap: wrap;
}
.banner .grow { flex: 1; min-width: 200px; }
.banner.warn { background: var(--slow-bg); }
.banner.warn > svg.i { color: var(--slow); }

/* ---------- State chips ---------- */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 650; padding: 2px 8px 2px 6px; border-radius: 999px; white-space: nowrap; }
.st svg.i { width: 14px; height: 14px; stroke-width: 2.1; }
.st.s0 { color: var(--locked); background: var(--locked-bg); }
.st.s1 { color: var(--appeal); background: var(--appeal-bg); }
.st.s2 { color: var(--slow); background: var(--slow-bg); }
.st.s3 { color: var(--ok); background: var(--ok-bg); }
.tone0 { color: var(--locked); } .tone1 { color: var(--appeal); } .tone2 { color: var(--slow); } .tone3 { color: var(--ok); }

/* ---------- Drill ---------- */
.drill { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; align-items: start; }
.scenarios { position: sticky; top: 72px; display: flex; flex-direction: column; gap: 6px; }
.scenarios h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px 4px; font-weight: 650; }
.scn {
  display: grid; grid-template-columns: 28px 1fr; gap: 2px 10px; text-align: left; width: 100%;
  padding: 10px 12px; border-radius: var(--radius); border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--ink);
}
.scn:hover { background: var(--panel); border-color: var(--line); }
.scn[aria-current="true"] { background: var(--panel); border-color: var(--line-2); box-shadow: var(--shadow); }
.scn .ico { grid-row: span 2; width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: var(--sunk); color: var(--ink-2); }
.scn[aria-current="true"] .ico { background: var(--ink); color: var(--bg); }
.scn .t { font-weight: 600; font-size: 14px; line-height: 1.3; }
.scn .m { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.scn .m b { font-weight: 650; }

.result-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.result-head h1 { font-size: 28px; letter-spacing: -.02em; font-weight: 720; }
.result-head .blurb { color: var(--ink-2); max-width: 70ch; }
.verdict { font-size: 17px; color: var(--ink); max-width: 70ch; }
.verdict b { font-weight: 700; }
.bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--sunk); max-width: 560px; }
.bar span { display: block; height: 100%; }
.bar .b0 { background: var(--locked); } .bar .b1 { background: var(--appeal); } .bar .b2 { background: var(--slow); } .bar .b3 { background: var(--ok); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

.group-h { font-size: 13px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin: 22px 0 8px; display: flex; gap: 8px; align-items: center; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.row > .rh {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%;
  padding: 12px 14px; background: transparent; border: 0; cursor: pointer; text-align: left; color: var(--ink);
}
.row > .rh:hover .nm { text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.row .nm { font-weight: 620; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row .nm .count { font-weight: 500; color: var(--muted); font-size: 13px; }
.row .why { font-size: 13px; color: var(--ink-2); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.cause { display: inline-flex; align-items: center; gap: 5px; background: var(--sunk); border-radius: 5px; padding: 1px 7px; font-size: 12.5px; }
.cause em { font-style: normal; color: var(--muted); }
.chev { color: var(--muted); transition: transform .15s; }
.row[data-open="true"] .chev { transform: rotate(90deg); }
.star { color: #c58a00; }
.detail { border-top: 1px solid var(--line); padding: 14px 16px 16px; display: grid; gap: 16px; }
.detail h4 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 8px; font-weight: 650; }
.route { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; }
.route .sep { color: var(--muted); }
.route .node { background: var(--sunk); padding: 2px 8px; border-radius: 5px; }
.route .way { font-weight: 600; }

.ways { display: flex; flex-direction: column; gap: 8px; }
.wayx { border: 1px solid var(--line); border-radius: var(--radius-s); padding: 9px 12px; background: var(--bg); }
.wayx .wh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.wayx .wh .lbl { font-weight: 600; }
.wayx .off { color: var(--muted); font-size: 13px; }
.wayx ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.wayx li { font-size: 13.5px; color: var(--ink-2); display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.wayx li .sl { color: var(--muted); min-width: 110px; }
.opt { display: inline-flex; gap: 5px; align-items: center; }
.opt + .opt::before { content: "or"; color: var(--muted); margin-right: 5px; font-size: 12.5px; }
details.sub { margin: 4px 0 2px 18px; border-left: 2px solid var(--line); padding-left: 10px; }
details.sub > summary { cursor: pointer; font-size: 13px; color: var(--accent); list-style: none; }
details.sub > summary::-webkit-details-marker { display: none; }
details.sub > summary::before { content: "▸ "; }
details.sub[open] > summary::before { content: "▾ "; }
.loop { background: var(--locked-bg); color: var(--ink); border-radius: var(--radius-s); padding: 9px 12px; font-size: 14px; display: flex; gap: 8px; align-items: flex-start; }
.loop svg.i { color: var(--locked); margin-top: 2px; }
.fixes { display: flex; flex-direction: column; gap: 8px; }
.fix { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; border: 1px dashed var(--line-2); border-radius: var(--radius-s); padding: 9px 12px; }
.fix .ft { font-weight: 580; font-size: 14px; }
.fix .fd { font-size: 13px; color: var(--muted); grid-column: 1; }
.fix .fa { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 8px; align-items: center; }
.note { font-size: 13px; color: var(--muted); }

.custom { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 10px; margin-top: 4px; }
.custom .cg { display: flex; flex-direction: column; gap: 5px; }
.custom .cg b { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 650; }
.custom .opts { display: flex; flex-direction: column; gap: 5px; }

/* ---------- Setup ---------- */
.setup { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.col-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.col-h h2 { font-size: 20px; letter-spacing: -.01em; }
.col-h p { color: var(--muted); font-size: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.card-h h3 { font-size: 15px; display: flex; gap: 8px; align-items: center; }
.card-h .hint { font-size: 13px; color: var(--muted); font-weight: 400; }
.empty { color: var(--muted); font-size: 13.5px; padding: 4px 0; }
.thing { display: grid; grid-template-columns: 22px minmax(120px, 1fr) auto; gap: 8px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.thing:first-of-type { border-top: 0; }
.thing .k { color: var(--muted); display: grid; place-items: center; }
.thing input.name { width: 100%; font-weight: 550; }
.thing .attrs { grid-column: 2 / span 2; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13.5px; color: var(--ink-2); }
.thing .attrs label.f { display: inline-flex; align-items: center; gap: 6px; }
.thing .attrs select { min-height: 30px; padding: 3px 24px 3px 7px; font-size: 13.5px; }
.thing .attrs label.tnote { flex: 1 1 100%; }
.thing .attrs label.tnote input { flex: 1; min-height: 30px; padding: 3px 8px; font-size: 13.5px; }
.thing .attrs .addnote { padding: 2px 6px; color: var(--muted); }
.chips { display: inline-flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; padding: 1px 4px 1px 9px; font-size: 13px; }
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--muted); width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.chip button:hover { background: var(--line); color: var(--ink); }
select.add { border-style: dashed; color: var(--accent); background: transparent; }
.acct { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.acct:first-of-type { border-top: 0; }
.acct .an { font-weight: 600; }
.acct .ac { font-size: 13px; color: var(--muted); }
.startoggle { border: 0; background: transparent; cursor: pointer; color: var(--line-2); padding: 2px; border-radius: 4px; display: grid; place-items: center; }
.startoggle[aria-pressed="true"] { color: #c58a00; }
.startoggle svg.i { width: 18px; height: 18px; }
.startoggle[aria-pressed="true"] svg.i { fill: currentColor; }

/* ---------- Dialog ---------- */
dialog { border: 0; padding: 0; border-radius: 12px; background: var(--panel); color: var(--ink); box-shadow: 0 24px 80px rgba(0,0,0,.3); width: min(820px, calc(100vw - 24px)); max-height: calc(100vh - 40px); }
dialog::backdrop { background: rgba(15, 15, 10, .45); }
.dlg { display: flex; flex-direction: column; max-height: calc(100vh - 40px); }
.dlg-h { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.dlg-h h2 { font-size: 18px; flex: 1; }
.dlg-b { padding: 16px 20px; overflow: auto; display: grid; gap: 14px; }
.dlg-f { display: flex; gap: 10px; justify-content: flex-end; padding: 12px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.fieldrow { display: flex; gap: 14px; flex-wrap: wrap; align-items: end; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--ink-2); font-weight: 550; }
.tips { background: var(--accent-bg); border-radius: var(--radius-s); padding: 10px 14px; font-size: 13.5px; }
.tips ul { margin: 4px 0 0; padding-left: 18px; }
.way-ed { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.way-ed[data-on="false"] { background: var(--bg); }
.way-ed[data-on="false"] .steps { display: none; }
.way-ed .wtop { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.way-ed .wtop .lbl { font-weight: 600; flex: 1; min-width: 180px; }
.kind { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 650; padding: 1px 7px; border-radius: 4px; background: var(--sunk); color: var(--muted); }
.steps { display: grid; gap: 6px; padding-left: 26px; }
.stepr { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
.stepr .sl { color: var(--muted); min-width: 130px; }
.warnline { color: var(--appeal); font-size: 13px; }
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.tpl { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius-s); padding: 10px 12px; cursor: pointer; }
.tpl:hover, .tpl:focus-visible { border-color: var(--accent); }
.tpl b { display: block; font-size: 14px; }
.tpl span { font-size: 12.5px; color: var(--muted); }
.ho-acct { border-top: 1px solid var(--line); padding-top: 14px; }
.field.grow { flex: 1; min-width: 200px; }
.field.grow input { width: 100%; }

/* ---------- Weak spots ---------- */
.weak { display: grid; gap: 28px; max-width: 980px; }
.weak section > h2 { font-size: 20px; margin-bottom: 4px; letter-spacing: -.01em; }
.weak section > p.sub { color: var(--muted); margin-bottom: 12px; font-size: 14px; }
.res { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 14px; align-items: start; padding: 12px 14px; border-top: 1px solid var(--line); }
.res:first-of-type { border-top: 0; }
.res .num { font-size: 13px; font-weight: 650; border-radius: 6px; padding: 6px 8px; text-align: center; }
.res .num b { display: block; font-size: 22px; line-height: 1.1; }
.res .n1 { background: var(--locked-bg); color: var(--locked); }
.res .n2 { background: var(--slow-bg); color: var(--slow); }
.res .n3 { background: var(--ok-bg); color: var(--ok); }
.res .n0 { background: var(--locked-bg); color: var(--locked); }
.res .rn { font-weight: 650; }
.res .sets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.set { background: var(--sunk); border-radius: 5px; padding: 2px 8px; color: var(--ink); font-size: 13px; }
.blast { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.blast .card { margin: 0; }
.blast .bn { font-weight: 650; display: flex; align-items: center; gap: 8px; }
.blast .bl { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; }
.chain .arrow { color: var(--muted); font-size: 12.5px; }
.chain .node { font-weight: 600; background: var(--sunk); padding: 2px 8px; border-radius: 5px; }
.warn-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.warn-list li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.warn-list .lvl { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; }
.lvl.high { background: var(--locked); } .lvl.medium { background: var(--slow); } .lvl.low { background: var(--line-2); }

/* ---------- Page headers ---------- */
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-h h1 { font-size: 30px; letter-spacing: -.02em; font-weight: 740; }
.page-h .meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
.page-h .lede { color: var(--ink-2); max-width: 72ch; margin-top: 6px; }
.page-h .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 650; margin-bottom: 4px; }
.weak .banner { margin: 0; }

/* ---------- Plan ---------- */
.plan-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.plan-grid .card { margin: 0; padding: 16px; }
.card-h h2 { font-size: 17px; letter-spacing: -.01em; }
.ready { list-style: none; margin: 0; padding: 0; display: grid; }
.ready li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.ready li:first-child { border-top: 0; }
.ready .grow { flex: 1; }
.ready .tick { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 1.5px solid var(--line-2); }
.ready li.ok .tick { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
.ready li.ok .tick svg.i { width: 14px; height: 14px; stroke-width: 2.4; }
.ready li.ok .grow { color: var(--ink-2); }
.drill-list { display: grid; }
.drow {
  display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; text-align: left;
  border: 0; border-top: 1px solid var(--line); background: transparent; padding: 9px 2px; cursor: pointer; color: var(--ink);
}
.drow:first-child { border-top: 0; }
.drow .ico { grid-row: span 2; width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: var(--sunk); color: var(--ink-2); }
.drow .t { font-weight: 600; font-size: 14px; line-height: 1.3; }
.drow .m { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; grid-column: 2; }
.drow .chev { grid-row: 1 / span 2; grid-column: 3; color: var(--muted); }
.drow:hover .t { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.weak section.weak-h { border-top: 1px solid var(--line); padding-top: 22px; }
.weak section.weak-h > h2 { font-size: 24px; }
.weak section.weak-h > p.sub { font-size: 16px; color: var(--ink-2); margin: 0; }

/* ---------- Handover ---------- */
.ho-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.ho-grid .card { margin: 0; padding: 16px; display: grid; gap: 14px; }
.weak .ho-share > h2 { font-size: 17px; margin: 0; }
.ho-status { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink-2); }
.ho-status.ok { color: var(--ok); }
.ho-status.warn { color: var(--slow); }
.ho-opt { display: flex; gap: 12px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: var(--radius-s); padding: 12px; flex-wrap: wrap; }
.ho-opt > div { flex: 1; min-width: 200px; }
.ho-tips { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }
.wish { display: grid; grid-template-columns: minmax(140px, 1fr) auto minmax(215px, .9fr) minmax(160px, 1.3fr); gap: 8px 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.wish:first-child { border-top: 0; }
.wish .wn { font-weight: 600; min-width: 0; }
.wish select, .wish .wnote { width: 100%; min-height: 32px; font-size: 13.5px; }
.paper { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 32px 36px; box-shadow: var(--shadow); max-width: 820px; }
.paper.solo { margin: 0 auto; }

/* ---------- The handover guide ---------- */
.guide { display: grid; gap: 24px; font-size: 15.5px; line-height: 1.55; }
.weak .guide section > h2, .guide section > h2 { font-size: 19px; margin-bottom: 10px; letter-spacing: -.01em; }
.guide h3 { font-size: 16px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.g-head h1 { font-size: 30px; letter-spacing: -.02em; font-weight: 740; }
.g-head .g-for { font-size: 17px; color: var(--ink-2); margin-top: 2px; }
.g-head .meta { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
.g-warn { background: var(--slow-bg); border-radius: var(--radius-s); padding: 8px 12px; font-size: 14px; }
.g-letter { margin: 0; border-left: 3px solid var(--accent); background: var(--accent-bg); padding: 12px 16px; border-radius: 0 var(--radius-s) var(--radius-s) 0; }
.g-letter p { white-space: pre-wrap; }
.g-letter footer { margin-top: 6px; color: var(--ink-2); font-style: italic; }
.g-lede { color: var(--ink-2); }
.g-sum { margin-top: 8px; font-weight: 600; }
.g-tips { margin: 0; padding-left: 20px; display: grid; gap: 4px; color: var(--ink-2); }
.g-gather { list-style: none; margin: 0; padding: 0; display: grid; border: 1px solid var(--line); border-radius: var(--radius); }
.g-gather li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 12px; border-top: 1px solid var(--line); }
.g-gather li:first-child { border-top: 0; }
.g-gather .gk { color: var(--muted); padding-top: 2px; }
.g-gather .gw { font-size: 14px; color: var(--ink-2); }
.g-gather .gn { font-size: 14px; color: var(--ink); margin-top: 2px; }
.g-gather .gs { font-size: 12.5px; color: var(--muted); white-space: nowrap; padding-top: 2px; }
.g-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.g-step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; }
.g-n { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.g-body { display: grid; gap: 6px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.g-step:last-child .g-body { border-bottom: 0; padding-bottom: 0; }
.g-how { font-size: 15px; }
.g-ref { color: var(--muted); }
.g-wish { background: var(--sunk); border-radius: var(--radius-s); padding: 8px 12px; font-size: 14.5px; display: grid; gap: 4px; }
.g-pre { white-space: pre-wrap; }
.g-legacy { font-size: 13.5px; color: var(--muted); }
.g-legacy b { color: var(--ink-2); font-weight: 600; }
.g-blocked { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.g-blocked li { display: grid; gap: 6px; border-left: 3px solid var(--locked); padding-left: 12px; }
.g-appendix details { border-top: 1px solid var(--line); padding: 8px 0; }
.g-appendix summary { cursor: pointer; font-weight: 600; }
.g-appendix summary .st { margin-left: 4px; vertical-align: 1px; }
.g-appendix details ul { margin: 6px 0 0; padding-left: 20px; font-size: 14px; color: var(--ink-2); display: grid; gap: 4px; }
.g-appendix details ul ul { margin-top: 2px; }
.g-foot { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }

/* ---------- Welcome & quick start ---------- */
.welcome { max-width: 760px; margin: 7vh auto 0; display: grid; gap: 22px; }
.welcome h1 { font-size: clamp(30px, 5vw, 44px); letter-spacing: -.03em; line-height: 1.1; font-weight: 760; }
.welcome .lede { font-size: 18px; color: var(--ink-2); max-width: 62ch; }
.welcome .cta { display: flex; gap: 10px; flex-wrap: wrap; }
.steps3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 10px; }
.steps3 div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; font-size: 14px; color: var(--ink-2); }
.steps3 b { display: block; color: var(--ink); margin-bottom: 4px; font-size: 14.5px; }
.privacy { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--muted); }
.qs { max-width: 760px; margin: 0 auto; display: grid; gap: 18px; }
.qs h1 { font-size: 26px; letter-spacing: -.02em; }
.qs fieldset { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px 14px; background: var(--panel); margin: 0; display: grid; gap: 10px; }
.qs legend { font-weight: 650; padding: 0 6px; }
.radios { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.lockscreen { max-width: 420px; margin: 14vh auto 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.lockscreen h1 { font-size: 22px; }
.err { color: var(--locked); font-size: 13.5px; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--bg);
  padding: 10px 14px 10px 16px; border-radius: 8px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: center; font-size: 14px; max-width: calc(100vw - 32px);
}
.toast button { background: transparent; border: 0; color: var(--accent-bg); font-weight: 650; cursor: pointer; padding: 2px 4px; }

#print { display: none; }

/* ---------- Responsive ---------- */
@media (max-width: 980px) {
  .drill { grid-template-columns: 1fr; }
  .scenarios { position: static; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .scenarios h2 { grid-column: 1 / -1; }
  .setup { grid-template-columns: 1fr; }
  .status { display: none; }
  .plan-grid, .ho-grid { grid-template-columns: 1fr; }
  .wish { grid-template-columns: minmax(0, 1fr) auto; }
  .wish select, .wish .wnote { grid-column: 1 / -1; }
}
@media (max-width: 640px) {
  main { padding: 16px 16px 80px; }
  .drill { gap: 18px; }
  .scenarios { display: flex; flex-direction: row; overflow-x: auto; gap: 8px; scroll-snap-type: x mandatory; padding: 2px 2px 8px; margin: 0 -16px; padding-left: 16px; scrollbar-width: thin; }
  .scenarios h2 { display: none; }

  .scenarios { scroll-padding-left: 16px; }
  .scn:last-child { margin-right: 16px; }
  .row > .rh { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "chip chev" "text chev"; row-gap: 6px; }
  .row > .rh > .st { grid-area: chip; justify-self: start; }
  .row > .rh > div { grid-area: text; }
  .row > .rh > .chev { grid-area: chev; }
  .top { padding: 8px 16px; gap: 10px; flex-wrap: wrap; }
  .tabs { order: 3; width: 100%; }
  .tab { flex: 1; padding: 6px 8px; }
  .result-head h1 { font-size: 23px; }
  .steps3 { grid-template-columns: 1fr; }
  .res { grid-template-columns: 1fr; }
  .res .num { justify-self: start; display: flex; gap: 8px; align-items: baseline; }
  .res .num b { font-size: 18px; }
  .wayx li .sl, .stepr .sl { min-width: 0; width: 100%; }
  .fix { grid-template-columns: 1fr; }
  .fix .fa { grid-row: auto; grid-column: 1; }
  .acct { grid-template-columns: auto minmax(0, 1fr) auto; }
  .acct .st { display: none; }
  .page-h h1, .g-head h1 { font-size: 25px; }
  .paper { padding: 20px 16px; border-radius: var(--radius); }
  .g-step { grid-template-columns: 1fr; gap: 6px; }
  .g-gather li { grid-template-columns: 22px minmax(0, 1fr); }
  .g-gather .gs { grid-column: 2; }
}

/* ---------- Print: the recovery plan ---------- */
@media print {
  /* Paper is white whatever the screen theme: pin a high-contrast palette (this selector list
     outranks the dark-theme rules above). */
  :root, :root:not([data-theme="light"]) {
    --bg: #fff; --panel: #fff; --sunk: #f1f1f1; --ink: #000; --ink-2: #222; --muted: #444;
    --line: #bbb; --line-2: #999; --accent: #000; --accent-2: #000; --accent-bg: #fff; --accent-ink: #fff;
    --ok: #000; --ok-bg: #fff; --slow: #000; --slow-bg: #fff; --appeal: #000; --appeal-bg: #fff; --locked: #000; --locked-bg: #fff;
    color-scheme: light;
  }
  body { background: #fff; color: #000; font-size: 11pt; }
  #app, .toast, dialog { display: none !important; }
  #print { display: block; }
  #print h1 { font-size: 20pt; margin-bottom: 4pt; }
  #print h2 { font-size: 13pt; margin: 14pt 0 6pt; border-bottom: 1px solid #999; padding-bottom: 2pt; }
  #print table { border-collapse: collapse; width: 100%; font-size: 10pt; }
  #print td, #print th { border: 1px solid #bbb; padding: 3pt 5pt; text-align: left; vertical-align: top; }
  #print .warnbox { border: 1.5px solid #000; padding: 6pt 8pt; margin: 8pt 0; font-size: 10pt; }
  #print ul { margin: 2pt 0; padding-left: 14pt; }
  #print .guide { display: block; font-size: 10.5pt; line-height: 1.4; color: #000; }
  #print .guide > * + * { margin-top: 12pt; }
  #print .guide h1 { font-size: 20pt; }
  #print .guide h2 { font-size: 13pt; }
  #print .guide h3 { font-size: 11.5pt; display: block; margin: 0; }
  #print .guide .st { background: none; color: #000; border: 1px solid #888; padding: 0 5pt; font-size: 8.5pt; }
  #print .guide .st svg { display: none; }
  #print .guide svg.i { width: 11pt; height: 11pt; }
  #print .g-letter { background: none; border-left: 2pt solid #000; }
  #print .g-wish { background: none; border: 1px solid #bbb; }
  #print .g-warn { background: none; border: 1.5px solid #000; }
  #print .g-n { background: none; color: #000; border: 1.5px solid #000; }
  #print .g-step, #print .g-gather li, #print .g-blocked li, #print .g-appendix details { break-inside: avoid; }
  #print .g-legacy, #print .g-ref, #print .note, #print .g-foot, #print .gs, #print .gw { color: #333; }
  #print .g-appendix summary { list-style: none; }
  #print .g-appendix summary::-webkit-details-marker { display: none; }
  #print .g-blocked li { border-left: 2pt solid #000; }
  #print .guide p, #print .guide li { orphans: 3; widows: 3; }
}

<div id="app"></div>
<div id="toast" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<div id="print" aria-hidden="true"></div>
<noscript><p style="max-width:40em;margin:4em auto;font:16px system-ui">Lockout Drill needs JavaScript. It runs entirely inside this page and makes no network requests.</p></noscript>
<script>"use strict";

const __m_engine = (() => {
// Lockout Drill — reachability engine.
//
// Everything you own or know (phones, places, papers, memorized secrets, phone numbers,
// authenticator apps, trusted people) and every account is a node. A node is reachable
// through "ways": each way is an AND of steps, each step an OR of alternatives. Ways carry a
// speed (instant / slow / appeal), so the result for every node is one of four states.
//
// A scenario (phone stolen, house fire, ...) removes things. We then compute the least fixed
// point of reachability, so circular dependencies never justify themselves: if Gmail's
// password lives in Bitwarden and Bitwarden needs a code from Gmail, losing the outside way in
// correctly locks both.
//
// The model follows the "account access graph" formalism from Hammann et al. (CCS 2019),
// extended with recovery speeds, physical locations, heirs and named scenarios.

const LOCKED = 0;
const APPEAL = 1;
const SLOW = 2;
const OK = 3;

const STATE_NAMES = ['locked', 'appeal', 'slow', 'ok'];
const SPEED_CAP = { instant: OK, slow: SLOW, appeal: APPEAL };

const PHYSICAL_KINDS = new Set(['phone', 'computer', 'tablet', 'seckey', 'paper', 'photoid']);
const DEVICE_KINDS = new Set(['phone', 'computer', 'tablet']);

// Step types whose alternatives need a *usable* (unlocked) device rather than just the hardware.
const DEVICE_USE_VIAS = new Set(['push', 'session', 'trusted_device', 'passkey', 'totp', 'any']);

const USE = '~use';

// ---------------------------------------------------------------------------------------------
// Compile a profile into a graph of nodes.
// ---------------------------------------------------------------------------------------------

function compile(profile) {
  const things = new Map((profile.things || []).map(t => [t.id, t]));
  const accounts = new Map((profile.accounts || []).map(a => [a.id, a]));
  const nodes = new Map();

  const exists = id => things.has(id) || accounts.has(id);
  const isDevice = id => things.has(id) && DEVICE_KINDS.has(things.get(id).kind);

  // Resolve a profile reference into a graph node id. Devices used for prompts, sessions or
  // apps need to be unlocked; a SIM only needs the hardware.
  const resolve = (ref, via) => {
    if (!exists(ref)) return null;
    if (isDevice(ref) && via !== 'sim' && DEVICE_USE_VIAS.has(via || 'any')) return ref + USE;
    return ref;
  };

  const step = (label, refs, via) => ({
    label,
    anyOf: refs.map(r => ({ ref: resolve(r, via), via, src: r })).filter(x => x.ref),
  });

  for (const t of things.values()) {
    const node = { id: t.id, type: 'thing', kind: t.kind, label: t.name || t.kind, ways: [], base: null, src: t };

    if (PHYSICAL_KINDS.has(t.kind)) {
      if (!t.at || t.at === 'carried' || !things.has(t.at)) {
        node.base = ctx => (ctx.perspective === 'heir' ? (t.heirCan === false ? LOCKED : OK) : OK);
        node.where = 'carried';
      } else {
        node.ways.push({ id: 'at', label: `Kept at ${things.get(t.at).name}`, speed: 'instant', direct: true, steps: [step('Location', [t.at], 'place')] });
        node.where = t.at;
      }
      if (DEVICE_KINDS.has(t.kind)) {
        const use = { id: t.id + USE, type: 'thing', kind: t.kind, label: t.name, derived: t.id, ways: [], base: null, src: t };
        const steps = [step('The device', [t.id], 'sim')];
        if (t.unlock && things.has(t.unlock)) steps.push(step('Unlock it', [t.unlock], 'unlock'));
        use.ways.push({ id: 'use', label: 'Unlock and use it', speed: 'instant', direct: false, steps });
        nodes.set(use.id, use);
      }
    } else if (t.kind === 'place') {
      const parent = t.inside && things.has(t.inside) ? t.inside : null;
      if (parent) {
        // Every enclosing place, innermost first (guarded against cycles in hand-edited files).
        const anc = [];
        const seen = new Set([t.id]);
        for (let cur = parent; cur && things.has(cur) && !seen.has(cur); cur = things.get(cur).inside) { anc.push(cur); seen.add(cur); }
        node.ancestors = anc;
        const heirBlocked = t.heirCan === false;
        node.ways.push({ id: 'in', label: `Inside ${things.get(parent).name}`, speed: 'instant', direct: true, who: heirBlocked ? 'me' : 'both', steps: [step('Location', [parent], 'place')] });
        // A fireproof safe survives the destruction of any place around it, but digging it out
        // takes a while.
        node.base = ctx => {
          if (ctx.perspective === 'heir' && heirBlocked) return LOCKED;
          return t.fireproof && anc.some(a => ctx.lost.has(a)) ? SLOW : LOCKED;
        };
      } else {
        node.base = ctx => {
          if (ctx.perspective === 'heir' && t.heirCan === false) return LOCKED;
          return ctx.away ? SLOW : OK;
        };
      }
    } else if (t.kind === 'secret') {
      node.base = ctx => (ctx.perspective === 'heir' ? (t.shared ? OK : LOCKED) : OK);
      const papers = (t.writtenOn || []).filter(p => things.has(p));
      if (papers.length) node.ways.push({ id: 'written', label: 'Written down', speed: 'instant', direct: false, steps: [step('Paper copy', papers, 'paper')] });
    } else if (t.kind === 'number') {
      if (t.sim && things.has(t.sim)) {
        node.ways.push({ id: 'sim', label: `SIM in ${things.get(t.sim).name}`, speed: 'instant', direct: true, steps: [step('Phone with the SIM', [t.sim], 'sim')] });
      }
      const ids = [...things.values()].filter(x => x.kind === 'photoid').map(x => x.id);
      node.ways.push({
        id: 'store', label: 'Replacement SIM at a carrier store', speed: 'slow', direct: false, inPerson: true, who: 'me',
        steps: ids.length ? [step('Photo ID', ids, 'photo_id')] : [],
      });
      if (t.carrier && accounts.has(t.carrier)) {
        node.ways.push({ id: 'esim', label: 'Move the number to a new eSIM via your carrier account', speed: 'slow', direct: false, steps: [step('Carrier account', [t.carrier], 'account')] });
      }
    } else if (t.kind === 'person') {
      node.base = () => OK;
    } else if (t.kind === 'authapp') {
      for (const d of (t.devices || []).filter(d => things.has(d))) {
        node.ways.push({ id: 'on:' + d, label: `Installed on ${things.get(d).name}`, speed: 'instant', direct: true, steps: [step('Device', [d], 'totp')] });
      }
      if (t.backup && exists(t.backup)) {
        const steps = [step('Backup', [t.backup], 'backup')];
        if (t.backupSecret && things.has(t.backupSecret)) steps.push(step('Backup password', [t.backupSecret], 'password'));
        node.ways.push({ id: 'restore', label: 'Restore from backup on a new phone', speed: 'instant', direct: false, steps });
      }
    }
    nodes.set(node.id, node);
  }

  for (const a of accounts.values()) {
    const node = { id: a.id, type: 'account', kind: 'account', label: a.name || 'Account', ways: [], base: null, src: a };
    const on = (a.ways || []).filter(w => w.enabled !== false);
    const filled = w => (w.steps || []).length > 0 && w.steps.every(s => (s.anyOf || []).length);
    for (const w of on) {
      // Some providers switch a route off when another is set up: Apple's Account Recovery
      // disappears once a recovery key or security keys are set; Microsoft's recovery form can't
      // help once two-step verification is on.
      if ((w.unlessWay || []).some(k => on.some(o => o !== w && o.key === k && filled(o)))) continue;
      if ((w.unlessVia || []).some(v => on.some(o => o !== w && (o.steps || []).some(s => (s.anyOf || []).some(x => x.via === v))))) continue;
      node.ways.push({
        id: w.id,
        label: w.label,
        wayKind: w.kind || 'signin',
        speed: Object.hasOwn(SPEED_CAP, w.speed) ? w.speed : 'instant',
        direct: false,
        inPerson: !!w.inPerson,
        who: w.who || 'both',
        ...(w.dataOnly ? { dataOnly: true } : {}),
        steps: (w.steps || []).map(s => ({
          label: s.label,
          types: s.types,
          anyOf: (s.anyOf || []).map(x => ({ ref: resolve(x.ref, x.via), via: x.via, src: x.ref })).filter(x => x.ref),
        })),
      });
    }
    nodes.set(node.id, node);
  }

  return { nodes, profile, things, accounts };
}

// ---------------------------------------------------------------------------------------------
// Simulation
// ---------------------------------------------------------------------------------------------

function makeContext(opts = {}) {
  return {
    lost: new Set(opts.lost || []),
    away: !!(opts.away || opts.abroad),
    abroad: !!opts.abroad,
    perspective: opts.perspective === 'heir' ? 'heir' : 'me',
  };
}

function wayApplies(node, way, ctx) {
  if (ctx.lost.has(node.id)) {
    // Losing a thing kills its direct ways (the SIM, the app on the device) but keeps its
    // recovery ways (carrier replacement, cloud backup). A lost account (hijacked) keeps only
    // support appeals.
    if (node.type === 'account' ? way.speed !== 'appeal' : way.direct) return false;
  }
  if (way.inPerson && ctx.abroad) return false;
  if (way.who === 'me' && ctx.perspective === 'heir') return false;
  if (way.who === 'heir' && ctx.perspective !== 'heir') return false;
  return true;
}

function wayValue(way, get) {
  let v = SPEED_CAP[way.speed];
  for (const s of way.steps) {
    let best = LOCKED;
    for (const alt of s.anyOf) {
      const x = get(alt.ref);
      if (x > best) best = x;
    }
    if (best < v) v = best;
    if (v === LOCKED) break;
  }
  return v;
}

// Index the graph once for fast repeated simulation (the analysis runs thousands of them).
function prepare(graph) {
  if (graph._fast) return graph._fast;
  const ids = [...graph.nodes.keys()];
  const index = new Map(ids.map((id, i) => [id, i]));
  const nodes = ids.map(id => graph.nodes.get(id));
  const ways = nodes.map(n => n.ways.map(w => ({
    w,
    dataOnly: !!w.dataOnly,
    cap: SPEED_CAP[w.speed],
    steps: w.steps.map(s => Int32Array.from(s.anyOf.map(a => index.get(a.ref)).filter(i => i !== undefined))),
  })));
  const deps = ids.map(() => new Set());
  ways.forEach((ws, i) => { for (const w of ws) for (const s of w.steps) for (const j of s) deps[j].add(i); });
  graph._fast = { ids, index, nodes, ways, dependents: deps.map(d => Int32Array.from(d)) };
  return graph._fast;
}

// Worklist propagation from all-locked upward (least fixed point). Every time a node rises we
// stamp it with a strictly increasing clock; a node's value is always computed from values that
// were stamped earlier, so explanations that only follow earlier stamps are well-founded.
//
// Some routes hand over an account's data or money but not a way to sign in (Google's Inactive
// Account Manager, Apple's Legacy Contact, a bank's estate process). They count for the account
// itself but can never unlock anything else: the fixed point runs without them (`use`), then they
// lift only their own account, stamped after everything else.
function run(fast, ctx) {
  const n = fast.ids.length;
  const st = new Uint8Array(n);
  const first = new Float64Array(n * 4).fill(Infinity);
  for (let i = 0; i < n; i++) first[i * 4] = 0;
  const queue = new Int32Array(n * 4 + 16);
  let qh = 0, qt = 0, size = 0;
  const inQ = new Uint8Array(n);
  const push = (i) => { inQ[i] = 1; queue[qt] = i; qt = (qt + 1) % queue.length; size++; };
  for (let i = 0; i < n; i++) push(i);
  let clock = 0;
  const get = j => st[j];
  while (size) {
    const i = queue[qh]; qh = (qh + 1) % queue.length; size--; inQ[i] = 0;
    const node = fast.nodes[i];
    let v = LOCKED;
    if (node.base && !ctx.lost.has(node.id) && !(node.derived && ctx.lost.has(node.derived))) v = node.base(ctx);
    const ws = fast.ways[i];
    for (let k = 0; k < ws.length && v < OK; k++) {
      const w = ws[k];
      if (w.dataOnly || !wayApplies(node, w.w, ctx)) continue;
      let x = w.cap;
      for (let s = 0; s < w.steps.length && x > v; s++) {
        let best = LOCKED;
        const alts = w.steps[s];
        for (let a = 0; a < alts.length; a++) { const y = get(alts[a]); if (y > best) best = y; }
        if (best < x) x = best;
      }
      if (x > v) v = x;
    }
    if (v > st[i]) {
      clock++;
      for (let l = st[i] + 1; l <= v; l++) first[i * 4 + l] = clock;
      st[i] = v;
      const d = fast.dependents[i];
      for (let k = 0; k < d.length; k++) if (!inQ[d[k]]) push(d[k]);
    }
  }
  const use = st.slice();
  for (let i = 0; i < n; i++) {
    const node = fast.nodes[i];
    let v = st[i];
    for (const w of fast.ways[i]) {
      if (!w.dataOnly || v === OK || !wayApplies(node, w.w, ctx)) continue;
      let x = w.cap;
      for (let s = 0; s < w.steps.length && x > v; s++) {
        let best = LOCKED;
        for (const a of w.steps[s]) if (use[a] > best) best = use[a];
        if (best < x) x = best;
      }
      if (x > v) v = x;
    }
    if (v > st[i]) {
      clock++;
      for (let l = st[i] + 1; l <= v; l++) first[i * 4 + l] = clock;
      st[i] = v;
    }
  }
  return { st, first, use };
}

// What a node is worth to the nodes that depend on it (data-only routes excluded).
const usable = (sim, id) => (sim.use || sim.state).get(id) ?? LOCKED;

function simulate(graph, ctxOrOpts) {
  const ctx = ctxOrOpts && ctxOrOpts.lost instanceof Set ? ctxOrOpts : makeContext(ctxOrOpts);
  const fast = prepare(graph);
  const { st, first, use } = run(fast, ctx);
  const state = new Map();
  const useMap = new Map();
  const firstMap = new Map();
  fast.ids.forEach((id, i) => {
    state.set(id, st[i]);
    useMap.set(id, use[i]);
    firstMap.set(id, [first[i * 4], first[i * 4 + 1], first[i * 4 + 2], first[i * 4 + 3]]);
  });
  return { ctx, state, use: useMap, first: firstMap };
}

// Array-level simulation for the analysis loops (no Map conversion).
function simulateRaw(graph, lost) {
  return run(prepare(graph), makeContext({ lost })).st;
}

// ---------------------------------------------------------------------------------------------
// Explanations
// ---------------------------------------------------------------------------------------------

const refLabel = (graph, ref) => graph.nodes.get(ref)?.label ?? ref;

// How a node is reached at its current state: the chosen way and the alternative used for
// each step, recursively (well-founded, so this never loops).
function derivation(graph, sim, id, depth = 6) {
  const node = graph.nodes.get(id);
  const level = sim.state.get(id);
  if (!node || level === LOCKED) return null;
  const at = sim.first.get(id)[level];
  const out = { id, label: node.label, state: level };
  if (node.base && !sim.ctx.lost.has(id) && !(node.derived && sim.ctx.lost.has(node.derived)) && node.base(sim.ctx) >= level) {
    out.base = true;
    return out;
  }
  const ordered = [...node.ways.filter(w => !w.dataOnly), ...node.ways.filter(w => w.dataOnly)];
  for (const w of ordered) {
    if (!wayApplies(node, w, sim.ctx) || SPEED_CAP[w.speed] < level) continue;
    const picks = [];
    let ok = true;
    for (const s of w.steps) {
      let pick = null;
      for (const alt of s.anyOf) {
        if (usable(sim, alt.ref) >= level && sim.first.get(alt.ref)[level] < at) {
          if (!pick || sim.first.get(alt.ref)[level] < sim.first.get(pick.ref)[level]) pick = alt;
        }
      }
      if (!pick) { ok = false; break; }
      picks.push({ step: s.label, via: pick.via, ref: pick.ref, label: refLabel(graph, pick.ref), sub: depth > 0 ? derivation(graph, sim, pick.ref, depth - 1) : null });
    }
    if (ok) {
      out.way = { id: w.id, label: w.label, speed: w.speed, kind: w.wayKind, ...(w.dataOnly ? { dataOnly: true } : {}) };
      out.picks = picks;
      return out;
    }
  }
  return out;
}

// Why a node isn't better than it is: every applicable way with its failing steps, recursing
// into derived nodes. Revisiting a node on the current path is reported as a cycle. Nodes met as
// options are judged by what they are worth to others (`use`): their data-only routes don't count.
function blockers(graph, sim, id, opts = {}) {
  const depth = opts.depth ?? 5;
  const target = opts.target ?? OK;
  const path = opts.path ?? [];
  const asOption = !!opts.use;
  const node = graph.nodes.get(id);
  const state = asOption ? usable(sim, id) : sim.state.get(id);
  const out = { id, label: node?.label ?? id, state, lost: sim.ctx.lost.has(id) || (!!node?.derived && sim.ctx.lost.has(node.derived)), ways: [], cycle: null };
  if (!node || state >= target) return out;
  if (path.includes(id)) {
    out.cycle = [...path.slice(path.indexOf(id)), id];
    return out;
  }
  if (depth <= 0) { out.truncated = true; return out; }
  const nextPath = [...path, id];
  for (const w of node.ways) {
    const applies = wayApplies(node, w, sim.ctx) && !(asOption && w.dataOnly);
    const value = applies ? wayValue(w, r => usable(sim, r)) : LOCKED;
    const wayOut = { id: w.id, label: w.label, speed: w.speed, kind: w.wayKind, value, disabled: applies ? null : (asOption && w.dataOnly && wayApplies(node, w, sim.ctx) ? 'data-only' : disabledReason(node, w, sim.ctx)), failing: [] };
    if (applies) {
      const need = Math.min(target, SPEED_CAP[w.speed]);
      for (const s of w.steps) {
        const best = Math.max(LOCKED, ...s.anyOf.map(a => usable(sim, a.ref)));
        if (best >= need) continue;
        wayOut.failing.push({
          step: s.label,
          empty: s.anyOf.length === 0,
          options: s.anyOf.map(a => ({
            ref: a.ref, via: a.via, label: refLabel(graph, a.ref), state: usable(sim, a.ref),
            why: blockers(graph, sim, a.ref, { depth: depth - 1, target: need, path: nextPath, use: true }),
          })),
        });
      }
    }
    out.ways.push(wayOut);
  }
  return out;
}

function disabledReason(node, way, ctx) {
  if (ctx.lost.has(node.id)) return node.type === 'account' ? 'hijacked' : 'lost';
  if (way.inPerson && ctx.abroad) return 'abroad';
  if (way.who === 'me' && ctx.perspective === 'heir') return 'only-you';
  if (way.who === 'heir' && ctx.perspective !== 'heir') return 'only-heir';
  return null;
}

// The things whose loss (in this scenario) is ultimately responsible for a node being below
// `target`: walk failing requirements down to scenario-affected base things.
function rootCauses(graph, sim, id, target = OK) {
  const causes = new Map();
  const cycles = [];
  const seen = new Set();
  const walk = (b) => {
    if (b.cycle) { cycles.push(b.cycle); return; }
    const key = b.id + ':' + b.state;
    if (seen.has(key)) return;
    seen.add(key);
    const node = graph.nodes.get(b.id);
    if (b.lost || affectedBase(node, sim.ctx)) causes.set(node.derived || b.id, reasonFor(graph, node, sim.ctx));
    for (const w of b.ways) for (const f of w.failing) for (const o of f.options) walk(o.why);
  };
  walk(blockers(graph, sim, id, { target, depth: 8 }));
  return { causes: [...causes].map(([id, reason]) => ({ id, label: refLabel(graph, id), reason })), cycles };
}

function affectedBase(node, ctx) {
  if (!node || !node.base) return false;
  const k = node.kind;
  const nested = !!node.ancestors;
  if (ctx.perspective === 'heir') {
    // A nested place is only itself the cause when the heir was kept out of it specifically.
    if (k === 'place' && nested) return node.src.heirCan === false;
    return (k === 'secret' || k === 'place' || PHYSICAL_KINDS.has(k)) && node.base(ctx) < OK;
  }
  if (k === 'place') {
    // Top-level places are "far away" when you're away; the rooms inside them aren't separate causes.
    if (nested) return !!node.src.fireproof && node.ancestors.some(a => ctx.lost.has(a));
    return ctx.away;
  }
  return false;
}

function reasonFor(graph, node, ctx) {
  if (!node) return '';
  const id = node.derived || node.id;
  if (ctx.lost.has(id)) {
    const k = graph.things.get(id)?.kind;
    if (k === 'place') return 'destroyed';
    if (k === 'secret') return 'forgotten';
    if (k === 'number') return 'number taken over';
    if (k === 'authapp') return 'app data wiped';
    if (k === 'person') return 'unavailable';
    if (node.type === 'account') return 'hijacked';
    return 'lost';
  }
  if (ctx.perspective === 'heir') return node.kind === 'secret' ? 'never shared' : 'out of reach';
  if (node.kind === 'place') return (node.ancestors || []).some(a => ctx.lost.has(a)) ? 'survived, slow to retrieve' : 'far away';
  return 'unavailable';
}

// ---------------------------------------------------------------------------------------------
// Scenarios
// ---------------------------------------------------------------------------------------------

function scenarioPresets(profile) {
  const things = profile.things || [];
  const byKind = k => things.filter(t => t.kind === k);
  const carried = things.filter(t => PHYSICAL_KINDS.has(t.kind) && (!t.at || t.at === 'carried'));
  const phones = byKind('phone');
  const dailyPhones = phones.filter(t => !t.at || t.at === 'carried');
  const homes = byKind('place').filter(t => t.home && !t.inside);
  const numbers = byKind('number');
  const secrets = byKind('secret');
  const trusted = profile.trusted || 'your trusted person';
  const out = [];
  out.push({ id: 'today', icon: 'today', title: 'A normal day', blurb: 'Nothing lost. Anything red here is already broken.', ctx: {} });
  if (phones.length) {
    const lose = (dailyPhones.length ? dailyPhones : phones.slice(0, 1)).map(t => t.id);
    out.push({ id: 'phone', icon: 'phone', title: 'Your phone is stolen', blurb: `You lose ${names(things, lose)}, and the SIM inside.`, ctx: { lost: lose } });
  }
  if (carried.length) {
    out.push({ id: 'travel', icon: 'travel', title: 'Robbed while traveling abroad', blurb: 'Everything you carry is gone, home is far away, and no carrier store can help.', ctx: { lost: carried.map(t => t.id), abroad: true } });
  }
  if (homes.length) {
    out.push({ id: 'fire', icon: 'fire', title: 'Your home burns down', blurb: `${names(things, homes.map(h => h.id))} and everything in it is destroyed. Fireproof safes survive.`, ctx: { lost: homes.map(t => t.id) } });
  }
  if (numbers.length) {
    out.push({ id: 'simswap', icon: 'sim', title: 'Your number is hijacked', blurb: 'A SIM-swap scammer takes over your phone number. Codes by text go to them.', ctx: { lost: numbers.map(t => t.id) } });
  }
  if (secrets.length) {
    out.push({ id: 'memory', icon: 'memory', title: "You can't remember passwords", blurb: 'After an accident or illness, nothing you memorized is available.', ctx: { lost: secrets.map(t => t.id) } });
  }
  const emails = (profile.accounts || []).filter(a => a.category === 'email' || a.category === 'platform');
  if (emails.length) {
    const g = compile(profile);
    const main = mostDependedOn(g, emails.map(a => a.id));
    if (main) out.push({ id: 'hijack', icon: 'mail', title: `${g.nodes.get(main).label} is hacked`, blurb: 'Someone takes over the account and changes its recovery options.', ctx: { lost: [main] } });
  }
  out.push({ id: 'heir', icon: 'heir', title: `You're gone — what can ${trusted} reach?`, blurb: `Only what ${trusted} can physically get to, plus secrets you shared.`, ctx: { perspective: 'heir' } });
  return out;
}

function names(things, ids) {
  const m = new Map(things.map(t => [t.id, t.name]));
  const list = ids.map(i => m.get(i) || i);
  return list.length <= 2 ? list.join(' and ') : list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1];
}

function mostDependedOn(graph, ids) {
  let best = null;
  let bestCount = 0;
  for (const id of ids) {
    let count = 0;
    for (const n of graph.nodes.values()) {
      if (n.id === id) continue;
      if (n.ways.some(w => w.steps.some(s => s.anyOf.some(a => a.ref === id)))) count++;
    }
    if (count > bestCount) { best = id; bestCount = count; }
  }
  return best;
}

// ---------------------------------------------------------------------------------------------
// Whole-profile analysis: blast radius, minimal lockout sets, cycles, warnings.
// ---------------------------------------------------------------------------------------------

// Things whose loss we try in combination: everything you own, know or rely on.
function lossCandidates(profile) {
  return (profile.things || []).map(t => t.id);
}

// Smallest combinations of lost things (up to maxSize) that push every target to `threshold`
// or below. Used to say when a circular dependency actually bites.
function minimalLockouts(graph, candidates, targets, { maxSize = 3, threshold = APPEAL, limit = 3, budget = 5000 } = {}) {
  const found = [];
  const fast = prepare(graph);
  const idx = targets.map(t => fast.index.get(t)).filter(i => i !== undefined);
  const hits = (lost) => {
    const st = simulateRaw(graph, lost);
    return idx.every(i => st[i] <= threshold);
  };
  if (hits([])) return [[]];
  let evaluated = 0;
  const combos = function* (k, start, acc) {
    if (acc.length === k) { yield acc; return; }
    for (let i = start; i < candidates.length; i++) yield* combos(k, i + 1, [...acc, candidates[i]]);
  };
  for (let k = 1; k <= maxSize && !found.length; k++) {
    for (const c of combos(k, 0, [])) {
      if (evaluated++ > budget) return found;
      if (hits(c)) { found.push(c); if (found.length >= limit) return found; }
    }
  }
  return found;
}

// For a strongly connected component, the short loops through it (shortest cycle through each
// member, deduplicated by rotation).
function shortLoops(graph, comp, edges) {
  const inComp = new Set(comp);
  const loops = new Map();
  for (const start of comp) {
    const prev = new Map([[start, null]]);
    const queue = [start];
    let closing = null;
    while (queue.length && !closing) {
      const v = queue.shift();
      for (const w of edges.get(v) || []) {
        if (!inComp.has(w)) continue;
        if (w === start) { closing = v; break; }
        if (!prev.has(w)) { prev.set(w, v); queue.push(w); }
      }
    }
    if (!closing) continue;
    const path = [];
    for (let v = closing; v !== null; v = prev.get(v)) path.unshift(v);
    const minIdx = path.indexOf([...path].sort()[0]);
    const key = [...path.slice(minIdx), ...path.slice(0, minIdx)].join('>');
    if (!loops.has(key)) loops.set(key, path);
  }
  return [...loops.values()].sort((a, b) => a.length - b.length);
}

function linkBetween(graph, from, to) {
  const n = graph.nodes.get(from);
  for (const w of n?.ways || []) for (const s of w.steps) for (const a of s.anyOf) {
    if (a.ref === to) return { way: w.label, step: s.label, via: a.via };
  }
  return null;
}

function analyze(profile, opts = {}) {
  const graph = compile(profile);
  const accounts = (profile.accounts || []).map(a => a.id);
  const baseline = simulate(graph, {});
  const candidates = opts.candidates || lossCandidates(profile);
  const maxSize = opts.maxSize ?? (candidates.length > 40 ? 2 : 3);
  const threshold = opts.threshold ?? APPEAL; // "locked out" = only a support appeal, or nothing

  const fast = prepare(graph);
  const accIdx = accounts.map(a => fast.index.get(a));
  const baseSt = accIdx.map(i => baseline.state.get(fast.ids[i]));
  const alive = accounts.map((a, k) => baseSt[k] > threshold); // already-broken accounts are reported elsewhere

  // Blast radius: lose each thing alone.
  const single = new Map();
  const blast = [];
  for (const c of candidates) {
    const st = simulateRaw(graph, [c]);
    single.set(c, st);
    const locked = [];
    const slowed = [];
    accounts.forEach((a, k) => {
      const after = st[accIdx[k]];
      if (after >= baseSt[k]) return;
      if (after <= threshold) locked.push(a); else slowed.push(a);
    });
    blast.push({ id: c, label: graph.nodes.get(c).label, locked, slowed });
  }
  const byId = new Map((profile.accounts || []).map(a => [a.id, a]));
  blast.sort((x, y) => weight(byId, y.locked) - weight(byId, x.locked) || weight(byId, y.slowed) - weight(byId, x.slowed));

  // Loops, and the smallest losses after which their members can only reach each other. Found in
  // the same enumeration as the lockout sets, so they share one budget.
  const loopMax = Math.min(maxSize, candidates.length > 25 ? 2 : 3);
  const baseRaw = simulateRaw(graph, []);
  const loops = findCycles(graph).map(c => ({ c, idx: c.members.filter(id => !id.endsWith(USE)).map(id => fast.index.get(id)).filter(i => i !== undefined), trig: [] }));
  for (const L of loops) if (L.idx.every(i => baseRaw[i] <= threshold)) L.trig = [[]];
  const loopWants = combo => combo.length <= loopMax && loops.some(L => L.trig.length < 2 && (!L.trig.length || L.trig[0].length === combo.length));

  // Minimal lockout sets (up to maxSize things lost together).
  const found = accounts.map(() => []);
  const isSuperset = (combo, list) => list.some(f => f.every(x => combo.includes(x)));
  const consider = (combo, st) => {
    for (let k = 0; k < accounts.length; k++) {
      if (!alive[k] || st[accIdx[k]] > threshold) continue;
      if (!isSuperset(combo, found[k])) found[k].push(combo);
    }
    if (combo.length > loopMax) return;
    for (const L of loops) {
      if (L.trig.length >= 2 || (L.trig.length && L.trig[0].length !== combo.length)) continue;

  for (const c of candidates) consider([c], single.get(c));
  let evaluated = candidates.length;
  const budget = opts.budget ?? 20000;

// Tarjan SCC over account-level dependencies (through things like authenticator apps and
// numbers). Reports groups of accounts that depend on each other.
function findCycles(graph) {
  const edges = new Map();
  for (const n of graph.nodes.values()) {
    const out = new Set();
    for (const w of n.ways) for (const s of w.steps) for (const a of s.anyOf) out.add(a.ref);
    edges.set(n.id, out);
  }
  let index = 0;
  const idx = new Map(), low = new Map(), onStack = new Set(), stack = [], comps = [];
  const strong = (v) => {
    idx.set(v, index); low.set(v, index); index++;
    stack.push(v); onStack.add(v);
    for (const w of edges.get(v) || []) {
      if (!idx.has(w)) { strong(w); low.set(v, Math.min(low.get(v), low.get(w))); }
      else if (onStack.has(w)) low.set(v, Math.min(low.get(v), idx.get(w)));
    }
    if (low.get(v) === idx.get(v)) {
      const comp = [];
      let w;
      do { w = stack.pop(); onStack.delete(w); comp.push(w); } while (w !== v);
      comps.push(comp);
    }
  };
  for (const v of graph.nodes.keys()) if (!idx.has(v)) strong(v);
  const result = [];
  for (const comp of comps) {
    if (comp.length < 2 || !comp.some(id => graph.nodes.get(id).type === 'account')) continue;
    for (const loop of shortLoops(graph, comp, edges)) {
      if (!loop.some(id => graph.nodes.get(id).type === 'account')) continue;
      const links = loop.map((id, i) => {
        const to = loop[(i + 1) % loop.length];
        return { from: id, to, fromLabel: refLabel(graph, id), toLabel: refLabel(graph, to), ...linkBetween(graph, id, to) };
      });
      result.push({ members: loop, labels: loop.map(id => refLabel(graph, id)), links });
    }
  }
  return result;
}

function warnings(profile, graph, baseline) {
  const out = [];
  const things = profile.things || [];
  const thingById = new Map(things.map(t => [t.id, t]));
  for (const a of profile.accounts || []) {
    const ways = (a.ways || []).filter(w => w.enabled !== false);
    if (!ways.length) {
      out.push({ level: 'high', kind: 'no-ways', account: a.id, text: `${a.name}: no way in is set up yet.` });
      continue;
    }
    if (baseline.state.get(a.id) === LOCKED) {
      out.push({ level: 'high', kind: 'broken', account: a.id, text: `${a.name}: even on a normal day, none of its ways in work. Check the setup.` });
    }
    const empty = ways.filter(w => (w.steps || []).some(s => !(s.anyOf || []).length));
    for (const w of empty) out.push({ level: 'low', kind: 'incomplete', account: a.id, text: `${a.name}: "${w.label}" is switched on but not filled in, so it's ignored.` });
    const recovery = ways.filter(w => w.kind === 'recovery' && w.speed !== 'appeal');
    if (!recovery.length && a.important) out.push({ level: 'medium', kind: 'no-recovery', account: a.id, text: `${a.name}: no recovery option besides a support appeal.` });
  }
  const papers = things.filter(t => t.kind === 'paper' || t.kind === 'seckey');
  const spots = new Map();
  for (const p of papers) {
    const where = topPlace(thingById, p.at);
    spots.set(where, (spots.get(where) || 0) + 1);
  }
  if (papers.length >= 2 && spots.size === 1) {
    const where = [...spots.keys()][0];
    const label = where === 'carried' ? 'on you' : (thingById.get(where)?.name || where);
    out.push({ level: 'medium', kind: 'one-place', text: `All your backup codes and security keys are in one place (${label}). One fire or theft takes all of them.` });
  }
  for (const app of things.filter(t => t.kind === 'authapp')) {
    if (!app.backup && (app.devices || []).length <= 1) out.push({ level: 'medium', kind: 'authapp', thing: app.id, text: `${app.name} lives on a single device with no backup.` });
  }

  }
  return out;
}

function topPlace(byId, at) {
  let cur = at;
  let guard = 0;
  while (cur && cur !== 'carried' && byId.get(cur)?.inside && guard++ < 20) cur = byId.get(cur).inside;
  return cur && cur !== 'carried' && byId.has(cur) ? cur : 'carried';
}

// The shortest loop of *failing* requirements that leads from this node back to itself in this
// scenario: the clearest way to say "these can only unlock each other right now".
// Only steps that actually hold a node below the level it needs are followed, and that level is
// carried down each edge (capped by the way's speed).
function stuckLoop(graph, sim, id, target = OK) {
  const st = (r) => usable(sim, r);
  const next = (nid, t) => {
    const n = graph.nodes.get(nid);
    const out = [];
    for (const w of n?.ways || []) {
      if (w.dataOnly || !wayApplies(n, w, sim.ctx)) continue;
      const need = Math.min(t, SPEED_CAP[w.speed]);
      if (need <= st(nid)) continue; // this way couldn't lift the node above where it already is
      const bests = w.steps.map(s => s.anyOf.reduce((m, a) => Math.max(m, st(a.ref)), LOCKED));
      const wayVal = bests.reduce((m, b) => Math.min(m, b), SPEED_CAP[w.speed]);
      w.steps.forEach((s, i) => {
        // Only the binding steps hold the way down: improving any other step changes nothing.
        if (bests[i] > wayVal || bests[i] >= need) return;
        for (const a of s.anyOf) if (st(a.ref) < need) out.push([a.ref, need]);
      });
    }
    return out;
  };
  const key = (n, t) => n + '@' + t;
  const start = key(id, target);
  const prev = new Map([[start, null]]);
  const queue = [[id, target]];
  while (queue.length) {
    const [v, t] = queue.shift();
    for (const [w, need] of next(v, t)) {
      if (w === id) {
        const path = [];
        for (let k = key(v, t); k !== null; k = prev.get(k)) path.unshift(k.slice(0, k.lastIndexOf('@')));
        return [...path, id];
      }
      const k = key(w, need);
      if (!prev.has(k)) { prev.set(k, key(v, t)); queue.push([w, need]); }
    }
  }
  return null;
}

function runScenario(profile, scenarioCtx, graph = compile(profile)) {
  const baseline = simulate(graph, {});
  const sim = simulate(graph, scenarioCtx);
  const rows = (profile.accounts || []).map(a => {
    const s = sim.state.get(a.id);
    const b = baseline.state.get(a.id);
    const stuck = s < b || s < OK;
    const rc = stuck ? rootCauses(graph, sim, a.id, Math.min(OK, b)) : { causes: [], cycles: [] };
    // Only this account's own loop (others show on their own rows), the shortest one.
    const loop = stuck ? stuckLoop(graph, sim, a.id, Math.min(OK, b)) : null;
    return { id: a.id, name: a.name, important: !!a.important, count: Math.max(1, a.count || 1), state: s, baseline: b, causes: rc.causes, cycles: loop ? [loop] : [] };
  });
  const tally = [0, 0, 0, 0];
  for (const r of rows) tally[r.state] += r.count;
  return { sim, baseline, rows, tally, graph };
}

  const who = heir ? (S.profile.trusted || 'your trusted person') : 'You';
  let verdict;
  if (!total) verdict = 'Add some accounts in Setup to run this drill.';
  else if (t[0] + t[1] + t[2] === 0) verdict = heir ? `${who} could get into everything right away.` : 'Everything stays reachable right away.';
  else {
    const bits = [];
    if (t[0]) bits.push(h('span', null, heir ? `${who} would be ` : "You'd be ", h('b', { class: 'tone0' }, 'locked out of ' + plural(t[0], 'account')), ''));
    if (t[1]) bits.push(h('span', null, h('b', { class: 'tone1' }, plural(t[1], 'account')), ' would depend on a support appeal'));
    if (t[2]) bits.push(h('span', null, h('b', { class: 'tone2' }, String(t[2])), ' would take days to get back'));
    if (t[3]) bits.push(h('span', null, h('b', { class: 'tone3' }, String(t[3])), heir ? ' would open right away' : ' stay fine'));
    verdict = [];
    bits.forEach((b, i) => { if (i) verdict.push(i === bits.length - 1 ? ', and ' : ', '); verdict.push(b); });
    verdict.push('.');
  }
  return h('header', { class: 'result-head' },
    h('h1', { tabindex: '-1' }, cur.title),
    h('p', { class: 'blurb' }, cur.blurb),
    h('p', { class: 'verdict' }, verdict),
    heir && total && !S.ephemeral ? h('p', { class: 'note' }, `The Handover tab turns this drill into a step-by-step guide for ${who}. `,
      h('button', { class: 'btn small', onclick: () => { S.view = 'handover'; rerender(); window.scrollTo({ top: 0 }); } }, 'See the guide')) : null,
    total ? h('div', { class: 'bar', role: 'img', 'aria-label': `${t[0]} locked out, ${t[1]} appeal only, ${t[2]} days, ${t[3]} fine` },
      [0, 1, 2, 3].map(s => t[s] ? h('span', { class: 'b' + s, style: `width:${(100 * t[s]) / total}%` }) : null)) : null,
    total ? h('div', { class: 'legend' }, [0, 1, 2, 3].map(s => h('span', null, h('i', { class: 'b' + s, style: `background:var(--${['locked', 'appeal', 'slow', 'ok'][s]})` }), STATE_LABEL[s]))) : null,
  );
}

const GROUP_TITLE = ['Locked out', 'Only by support appeal', 'Back in days', 'Still fine'];

function resultRows(cur, res, openEditor) {
  if (!res.rows.length) return h('p', { class: 'empty' }, 'No accounts yet.');
  const out = [];
  for (const s of [LOCKED, APPEAL, SLOW, OK]) {
    const rows = res.rows.filter(r => r.state === s).sort((a, b) => (b.important - a.important) || a.name.localeCompare(b.name));
    if (!rows.length) continue;
    const n = rows.reduce((x, r) => x + r.count, 0);
    out.push(h('h2', { class: 'group-h' }, stateChip(s, GROUP_TITLE[s]), h('span', null, plural(n, 'account'))));
    out.push(h('div', { class: 'rows' }, rows.map(r => row(cur, res, r, openEditor))));
  }
  return out;
}

function row(cur, res, r, openEditor) {
  const open = S.open.has(r.id);
  const toggle = () => { open ? S.open.delete(r.id) : S.open.add(r.id); rerender(); };
  return h('article', { class: 'row', 'data-open': String(open) },
    h('button', { class: 'rh', 'aria-expanded': String(open), onclick: toggle, dataset: { k: 'row:' + r.id } },
      stateChip(r.state),
      h('div', null,
        h('div', { class: 'nm' }, r.important ? icon('star', 'i star') : null, r.name, r.count > 1 ? h('span', { class: 'count' }, `· ${r.count} accounts`) : null,
          r.cycles.length ? h('span', { class: 'cause', title: 'Part of a circular dependency' }, icon('loop'), 'loop') : null),
        h('div', { class: 'why' }, summary(res, r)),
      ),
      icon('chevron', 'i chev'),
    ),
    open ? detail(cur, res, r, openEditor) : null,
  );
}

function summary(res, r) {
  const g = res.graph;
  if (r.state === OK) {
    const d = derivation(g, res.sim, r.id, 1);
    return d?.way ? ['via ', h('b', null, d.way.label.toLowerCase())] : (d?.base ? 'available' : '');
  }
  const parts = r.causes.slice(0, 4).map(c => h('span', { class: 'cause' }, c.label, h('em', null, ' — ' + c.reason)));
  if (r.causes.length > 4) parts.push(h('span', { class: 'cause' }, `+${r.causes.length - 4} more`));
  if (r.state > LOCKED) {
    const d = derivation(g, res.sim, r.id, 1);
    if (d?.way) parts.push(h('span', null, '→ ', d.way.label.toLowerCase()));
  }
  if (!parts.length && r.state < OK) parts.push(h('span', null, 'Not set up with any way in that works here.'));
  return parts;
}
